<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA-TA</title>
<style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f0f0f; overflow: hidden; }
    iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
        /* Тёмная инверсия — другой интерфейс */
        filter: invert(0.9) hue-rotate(180deg) contrast(0.95) brightness(0.95);
    }
    .bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(15,15,15,0.95);
        color: #888; font: 12px system-ui, sans-serif;
        padding: 8px 12px; text-align: center;
        border-top: 1px solid #2a2a2a;
    }
</style>
</head>
<body>
    <iframe src="https://va-ta.com/app" allow="clipboard-write; clipboard-read"></iframe>
    <div class="bar">Открыто с фильтром тёмной темы</div>
</body>
</html>
