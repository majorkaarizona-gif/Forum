<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA-TA Cyber-Red</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #050505;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }
    
    /* САМ САЙТ (IFRAME) */
    #siteFrame {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
        /* МАГИЯ: Превращаем бирюзовый в кроваво-красный и затемняем */
        filter: hue-rotate(160deg) saturate(1.6) contrast(1.2) brightness(0.85);
        /* Оставляем место под наше нижнее меню на телефоне */
        padding-bottom: 70px; 
    }

    /* НАШ НОВЫЙ НИЖНИЙ НАВИГАТОР (ПОВЕРХ САЙТА) */
    .custom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 70px;
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(229, 9, 20, 0.3);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 9999;
        box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #9A9A9A;
        text-decoration: none;
        font-size: 11px;
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        cursor: pointer;
        width: 16%;
    }

    /* Иконки */
    .nav-item svg {
        width: 24px;
        height: 24px;
        margin-bottom: 4px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
    }

    /* Активный элемент и наведение */
    .nav-item.active, .nav-item:hover {
        color: #E50914;
    }
    
    .nav-item.active svg, .nav-item:hover svg {
        stroke: #E50914;
        filter: drop-shadow(0 0 8px rgba(229, 9, 20, 0.8));
        transform: translateY(-2px);
    }

    /* ВЕРХНЯЯ ПЛАШКА */
    .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: rgba(5, 5, 5, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }
    .top-bar h1 {
        margin: 0;
        color: #E50914;
        font-family: 'Oswald', sans-serif;
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
    }

    /* ПК ВЕРСИЯ (Убираем телефонию) */
    @media (min-width: 800px) {
        .custom-nav { display: none; } /* На ПК меню снизу не нужно */
        #siteFrame { padding-bottom: 0; padding-top: 50px; }
        .top-bar { height: 50px; }
        .top-bar h1 { font-size: 20px; }
    }
</style>
</head>
<body>

    <!-- Верхняя плашка для красоты -->
    <div class="top-bar">
        <h1>VA-TA // Red Edition</h1>
    </div>

    <!-- Сайт -->
    <iframe id="siteFrame" src="https://va-ta.com/app" allow="clipboard-write; clipboard-read"></iframe>

    <!-- Наше кастомное меню с SVG иконками -->
    <div class="custom-nav">
        <a href="https://va-ta.com/app/#/overview" target="siteFrame" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Обзор
        </a>
        <a href="https://va-ta.com/app/#/shops" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            Лавки
        </a>
        <a href="https://va-ta.com/app/#/prices" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Цены
        </a>
        <a href="https://va-ta.com/app/#/ads" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            Объяв.
        </a>
        <a href="https://va-ta.com/app/#/rating" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            Рейтинг
        </a>
        <a href="https://va-ta.com/app/#/profile" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Профиль
        </a>
    </div>

<script>
    // Скрипт для переключения активной вкладки в нашем меню
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
        item.addEventListener('click', function() {
            // Убираем активный класс у всех
            navItems.forEach(nav => nav.classList.remove('active'));
            // Добавляем кликнутому
            this.classList.add('active');
        });
    });
</script>
</body>
</html>
