<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounty Market</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
        height: 100%;
        background-color: #050505;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    /* ОБЕРТКА */
    #app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
    }

    /* ВЕРХНЯЯ ШАПКА (BOUNTY MARKET) */
    .top-bar {
        height: 50px;
        background: #0A0A0A;
        border-bottom: 1px solid rgba(229, 9, 20, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: 0 2px 15px rgba(229, 9, 20, 0.1);
    }
    .top-bar h1 {
        font-family: 'Oswald', sans-serif;
        color: #E50914;
        text-transform: uppercase;
        font-size: 18px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
    }

    /* САМ САЙТ (IFRAME) */
    .iframe-wrapper {
        flex: 1;
        position: relative;
        background: #000;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }

    /* НИЖНЕЕ МЕНЮ (ДЛЯ ТЕЛЕФОНА) */
    .bottom-nav {
        height: 65px;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(229, 9, 20, 0.3);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 10;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #9A9A9A;
        text-decoration: none;
        font-size: 11px;
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
        transition: 0.3s;
        width: 16%;
    }
    
    .nav-item svg {
        width: 22px;
        height: 22px;
        margin-bottom: 4px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: 0.3s;
    }

    /* Эффекты при наведении и активном состоянии */
    .nav-item:hover, .nav-item:active {
        color: #E50914;
    }
    .nav-item:hover svg, .nav-item:active svg {
        stroke: #E50914;
        filter: drop-shadow(0 0 6px rgba(229, 9, 20, 0.8));
        transform: translateY(-2px);
    }

    /* АДАПТИВ ПОД ПК */
    @media (min-width: 800px) {
        /* На ПК прячем нижнее меню, делаем верхнее */
        .bottom-nav { display: none; }
        
        .top-bar {
            height: 60px;
            justify-content: flex-start;
            padding: 0 30px;
            gap: 40px;
        }
        
        .top-bar h1 { font-size: 24px; margin-right: 20px; }
        
        /* Навигация переезжает наверх */
        .pc-nav {
            display: flex;
            gap: 20px;
        }
        .pc-nav a {
            color: #9A9A9A;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .pc-nav a svg {
            width: 20px; height: 20px;
            fill: none; stroke: currentColor; stroke-width: 2;
        }
        .pc-nav a:hover { color: #E50914; }
        .pc-nav a:hover svg { stroke: #E50914; filter: drop-shadow(0 0 6px rgba(229,9,20,0.8)); }
    }
    
    /* Скрываем ПК-меню на телефоне */
    @media (max-width: 799px) {
        .pc-nav { display: none; }
    }
</style>
</head>
<body>

<div id="app-container">
    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="top-bar">
        <h1>Bounty Market</h1>
        <!-- Меню для ПК -->
        <nav class="pc-nav">
            <a href="https://va-ta.com/app/#overview" target="siteFrame">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Обзор
            </a>
            <a href="https://va-ta.com/app/#shops" target="siteFrame">
                <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                Лавки
            </a>
            <a href="https://va-ta.com/app/#prices" target="siteFrame">
                <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                Цены
            </a>
            <a href="https://va-ta.com/app/#listings" target="siteFrame">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                Объяв.
            </a>
            <a href="https://va-ta.com/app/#rating" target="siteFrame">
                <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                Рейтинг
            </a>
            <a href="https://va-ta.com/app/#profile" target="siteFrame">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Профиль
            </a>
        </nav>
    </header>

    <!-- САМ САЙТ -->
    <div class="iframe-wrapper">
        <iframe name="siteFrame" src="https://va-ta.com/app" allow="clipboard-write; clipboard-read"></iframe>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ (ДЛЯ ТЕЛЕФОНА) -->
    <nav class="bottom-nav">
        <a href="https://va-ta.com/app/#overview" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Обзор
        </a>
        <a href="https://va-ta.com/app/#shops" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            Лавки
        </a>
        <a href="https://va-ta.com/app/#prices" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Цены
        </a>
        <a href="https://va-ta.com/app/#listings" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            Объяв.
        </a>
        <a href="https://va-ta.com/app/#rating" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            Рейтинг
        </a>
        <a href="https://va-ta.com/app/#profile" target="siteFrame" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Профиль
        </a>
    </nav>
</div>

</body>
</html>
