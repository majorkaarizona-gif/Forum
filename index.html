<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA-TA Cyber-Red</title>
<!-- Подключаем твои шрифты -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
    /* Общие стили для самой страницы index.html */
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #050505;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }
    
    /* Контейнер для сайта */
    iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
    }

    /* Красивая плашка, если сайт заблокируется */
    #fallback {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #fff;
        z-index: 999;
    }
    #fallback h1 {
        font-family: 'Oswald', sans-serif;
        color: #E50914;
        text-transform: uppercase;
        font-size: 2em;
        text-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
        margin-bottom: 10px;
    }
    #fallback p {
        color: #9A9A9A;
        max-width: 400px;
        text-align: center;
        line-height: 1.5;
        margin-bottom: 20px;
    }
    #fallback a {
        background: linear-gradient(135deg, #E50914 0%, #800000 100%);
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 700;
        box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
    }

    /* Скрываем плашку, если сайт загрузился */
    .loaded #fallback {
        display: none;
    }
</style>
</head>
<body>

    <!-- Сюда грузится сам сайт -->
    <iframe id="siteFrame" src="https://va-ta.com/app" onload="document.body.classList.add('loaded')"></iframe>

    <!-- Плашка на случай, если сайт заблокирует показ -->
    <div id="fallback">
        <h1>Ошибка загрузки</h1>
        <p>Сайт VA-TA запрещает открывать себя внутри других страниц (защита безопасности).</p>
        <p>Но у тебя уже установлен Tampermonkey! Просто нажми кнопку ниже, и сайт откроется сразу с твоей темой.</p>
        <a href="https://va-ta.com/app" target="_blank">Открыть VA-TA</a>
    </div>

<script>
    // Вставляем стили прямо внутрь iframe, если он загрузился
    const frame = document.getElementById('siteFrame');
    
    frame.onload = function() {
        try {
            document.body.classList.add('loaded');
            const doc = frame.contentDocument || frame.contentWindow.document;

            // Проверяем, прогрузился ли сайт (если да, вставляем стили)
            if (doc) {
                const style = doc.createElement('style');
                style.textContent = `
                    /* ТВОЙ ДИЗАЙН */
                    :root { --accent: #E50914 !important; }
                    html, body, #app, .app, main { 
                        background: #050505 !important; 
                        color: #FFF !important; 
                        font-family: 'Inter', sans-serif !important; 
                    }
                    h1, h2, h3, [class*="title"] { 
                        font-family: 'Oswald', sans-serif !important; 
                        text-transform: uppercase !important; 
                    }
                    /* Защита картинок предметов */
                    img, canvas { filter: none !important; }
                    
                    /* Карточки (Стекло) */
                    .card, [class*="card"], [class*="item"] {
                        background: rgba(22, 22, 22, 0.75) !important;
                        backdrop-filter: blur(12px) !important;
                        border: 1px solid rgba(255,255,255,0.05) !important;
                        border-radius: 12px !important;
                    }
                    /* Акценты */
                    [class*="price"], .active { color: #E50914 !important; }
                    
                    /* Кнопки */
                    button, .btn { 
                        background: #161616 !important; 
                        border: 1px solid #333 !important; 
                        color: #FFF !important; 
                    }
                    button:hover, .btn:hover { 
                        background: #E50914 !important; 
                        box-shadow: 0 0 15px rgba(229,9,20,0.6) !important; 
                    }
                `;
                doc.head.appendChild(style);
                console.log("Стили успешно внедрены в iframe!");
            }
        } catch (e) {
            // Если браузер заблокировал доступ (CORS), показываем плашку
            console.log("Сайт запретил менять стили внутри iframe.");
        }
    };
</script>
</body>
</html>
