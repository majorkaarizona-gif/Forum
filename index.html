<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Store Logo</title>
    <style>
        /* Стили для центрирования картинки на странице */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* Темно-серый фон страницы */
        }

        .logo-container {
            width: 500px; /* Размер картинки на экране */
            max-width: 90vw;
            height: auto;
            /* Добавим легкую тень для красоты */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Начало SVG кода -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
            <!-- Черный фон -->
            <rect width="100%" height="100%" fill="#000000"/>

            <!-- Белая обводка (внешний контур головы) -->
            <path d="M 300 120 
                     C 350 100, 400 130, 420 180 
                     C 450 200, 460 250, 450 300 
                     C 480 350, 460 430, 400 470 
                     C 380 490, 350 500, 300 490 
                     C 250 500, 200 490, 160 460 
                     C 100 420, 90 350, 110 300 
                     C 90 250, 100 200, 140 170 
                     C 170 130, 230 100, 300 120 Z" 
                  fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/>

            <!-- Голова медведя (основной красный/оранжевый цвет) -->
            <path d="M 300 140 
                     C 340 130, 380 150, 400 190 
                     C 420 210, 430 250, 420 290 
                     C 440 330, 430 400, 380 430 
                     C 350 450, 320 450, 300 440 
                     C 270 450, 230 440, 200 420 
                     C 150 380, 140 320, 160 280 
                     C 140 240, 160 190, 200 160 
                     C 230 140, 260 130, 300 140 Z" 
                  fill="#E33012"/>

            <!-- Черные тени/детали морды -->
            <path d="M 180 240 Q 220 220 260 250 L 230 270 Q 200 260 180 240 Z" fill="#000000"/> <!-- Глаз -->
            <path d="M 180 300 Q 220 310 250 350 Q 200 370 180 340 Z" fill="#000000"/> <!-- Рот -->
            <path d="M 280 200 Q 330 180 370 210 Q 350 260 300 300 Z" fill="#000000"/> <!-- Уши/тени сверху -->
            <path d="M 380 250 Q 410 300 380 380 Q 360 350 370 300 Z" fill="#000000"/> <!-- Боковые тени -->

            <!-- Флаг России на шее/плече -->
            <g transform="translate(380, 180) rotate(15)">
                <rect x="0" y="0" width="60" height="15" fill="#FFFFFF"/>
                <rect x="0" y="15" width="60" height="15" fill="#0039A6"/>
                <rect x="0" y="30" width="60" height="15" fill="#D52B1E"/>
            </g>

            <!-- Текст "BLACK STORE" -->
            <text x="50%" y="560" font-family="Arial Black, Impact, sans-serif" 
                  font-weight="bold" font-size="56" fill="#E33012" 
                  text-anchor="middle" letter-spacing="2">BLACK STORE</text>
        </svg>
        <!-- Конец SVG кода -->
    </div>

</body>
</html>
