    /* ============ ПОЛНЫЙ ВИЗУАЛЬНЫЙ РЕФРЕШ: ТЕМАТИЧЕСКИЕ ИГРОВЫЕ МИРЫ ============ */
    :root{--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--text-muted:#b4bdce;--shadow:0 16px 42px rgba(0,0,0,.24)}

    /* Общая игровая поверхность: сцена выглядит как стол, а не просто список карточек. */
    #viewRoot{position:relative;isolation:isolate;min-height:45vh}
    #viewRoot:before{content:"";position:absolute;z-index:-1;pointer-events:none;inset:-1px -12px 0;border-radius:28px;opacity:.62}

    body.theme-bunker #viewRoot:before{background:radial-gradient(ellipse at 50% 0,#9ca3af22,transparent 60%),repeating-linear-gradient(0deg,transparent 0 31px,#ffffff05 32px 33px),linear-gradient(135deg,#0f172a33,#b4530910)}
    body.theme-munchkin #viewRoot:before{background:radial-gradient(ellipse at 50% 0,#f59e0b35,transparent 58%),repeating-linear-gradient(90deg,transparent 0 37px,#ffde8a08 38px 39px),linear-gradient(180deg,#32130366,transparent 75%)}
    /* Шпион: затемнённая оперативная комната, красные акценты и металлические панели. */
    body.theme-spy{--surface:#171923;--surface-2:#222635;--border:rgba(248,113,113,.16);--accent:#fb5364;--accent-grad:linear-gradient(135deg,#fb5364,#991b35);--accent-soft:rgba(251,83,100,.14);--chat-me:#a5273f;--chat-other:#252936}
    body.theme-spy .card-face.front{background:radial-gradient(circle at center,#481824,#11131d 72%);border-color:#fb536499}
    body.theme-spy .card-face.front:before{border-color:#fb718566;background:repeating-linear-gradient(135deg,transparent 0 12px,#fb71850b 13px 14px)}
    body.theme-spy .card-face.back{background:linear-gradient(145deg,#32131e,#11131d);border-color:#fb5364aa}
    body.theme-spy .spy-role,body.theme-spy .info-tile,body.theme-spy .turn-banner{box-shadow:inset 0 1px #ffffff08,0 10px 25px #0002}
    /* Крокодил: яркий игровой коврик, живые цвета и мягкие карточки. */
    body.theme-crocodile{--surface:#0c352e;--surface-2:#145044;--border:rgba(110,231,183,.2);--accent:#34d399;--accent-grad:linear-gradient(135deg,#6ee7b7,#059669);--accent-soft:rgba(52,211,153,.15);--chat-me:#047857;--chat-other:#124a3d}
    body.theme-crocodile .turn-banner,body.theme-crocodile .info-tile,body.theme-crocodile .player-card{border-radius:22px;box-shadow:0 10px 20px #022b2240}
    body.theme-crocodile .turn-avatar{border-radius:50%;background:linear-gradient(145deg,#a7f3d0,#059669);color:#052e26}
    /* Бункер: бетон, предупреждающая разметка и металлический стол. */
    body.theme-bunker{--surface:#242a30;--surface-2:#343b42;--border:rgba(203,213,225,.18);--accent:#f59e0b;--accent-grad:linear-gradient(135deg,#fbbf24,#b45309);--accent-soft:rgba(245,158,11,.14);--chat-me:#854d0e;--chat-other:#303841}
    body.theme-bunker .panel,body.theme-bunker .info-tile,body.theme-bunker .player-card{background:linear-gradient(145deg,#353d45,#22272d);border-color:#94a3b82b;border-radius:13px;box-shadow:inset 0 1px #ffffff0a,0 12px 22px #0003}
    body.theme-bunker .player-grid{border-radius:12px;background:repeating-linear-gradient(135deg,#ffffff04 0 18px,#00000008 19px 20px),#161b20}
    body.theme-bunker .pill{border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
    /* Манчкин: стол тёмного дерева, золото, пергаментные предметы и фэнтези-атмосфера. */
    body.theme-munchkin{--surface:#3d2415;--surface-2:#59371c;--border:rgba(253,230,138,.21);--accent:#fcd34d;--accent-grad:linear-gradient(135deg,#fde68a,#d97706);--accent-soft:rgba(252,211,77,.15);--chat-me:#854d0e;--chat-other:#50311d;--text-muted:#e7cda4}
    body.theme-munchkin .panel,body.theme-munchkin .info-tile,body.theme-munchkin .player-card{background:linear-gradient(145deg,#5a3820,#382112);border-color:#fcd34d2b;box-shadow:inset 0 1px #fff1,0 13px 26px #1d0e0666}
    body.theme-munchkin .player-grid{background:repeating-linear-gradient(90deg,#fcd34d05 0 40px,#0000000a 41px 42px),#2a180e;border-color:#d6a34935}
    body.theme-munchkin .item-card,.theme-munchkin .hand-card,.theme-munchkin .monster-card{border-radius:13px;border-color:#e6b85760;box-shadow:0 8px 18px #1c0d0866}
    body.theme-munchkin .card-face.front{background:radial-gradient(circle at center,#9a5a18,#3c210f 72%);border-color:#fcd34d}
    body.theme-munchkin .card-face.back{background:linear-gradient(145deg,#6b431f,#2d180d);border-color:#fcd34d}
    /* Чат наследует атмосферу текущей игры; сообщения не смешиваются с фоном стола. */
    .chat-overlay{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 96%,var(--accent)),var(--bg));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border));box-shadow:0 25px 90px #0009;backdrop-filter:blur(20px)}
    .chat-header{background:color-mix(in srgb,var(--surface) 92%,var(--accent));border-bottom-color:color-mix(in srgb,var(--accent) 22%,var(--border))}
    .chat-messages{background-image:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--accent) 7%,transparent),transparent 55%)}
    .chat-bubble{border:1px solid color-mix(in srgb,var(--accent) 13%,var(--border));box-shadow:0 4px 12px #0002}
    .chat-message.mine .chat-bubble{background:linear-gradient(145deg,color-mix(in srgb,var(--chat-me) 90%,var(--accent)),var(--chat-me));border-color:color-mix(in srgb,var(--accent) 23%,transparent)}
    .chat-message.system .chat-bubble{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
    .chat-compose{background:color-mix(in srgb,var(--surface) 94%,var(--accent));border-top-color:color-mix(in srgb,var(--accent) 17%,var(--border))}
    body.theme-spy .chat-overlay{background:linear-gradient(180deg,#1b1a25,#10121b)}
    body.theme-crocodile .chat-overlay{background:linear-gradient(180deg,#10473b,#082b24)}
    body.theme-bunker .chat-overlay{background:repeating-linear-gradient(0deg,transparent 0 34px,#ffffff04 35px 36px),linear-gradient(180deg,#303942,#171b20)}
    body.theme-munchkin .chat-overlay{background:repeating-linear-gradient(90deg,transparent 0 45px,#fcd34d04 46px 47px),linear-gradient(180deg,#50311b,#26160d)}
    .modal-card{border-color:color-mix(in srgb,var(--accent) 24%,var(--border));box-shadow:0 24px 80px #0009}
    .toast{border-color:color-mix(in srgb,var(--accent) 20%,#ffffff1a)}

    /* ===== ОБНОВЛЁННЫЙ АРТ-ДИРЕКШН: EDITORIAL / BOARD-GAME TABLE ===== */
    :root{--bg:#090b10;--surface:#121722;--surface-2:#1b2230;--text:#f3f5f9;--text-muted:#a1a9b8;--border:rgba(255,255,255,.095);--shadow:0 18px 55px rgba(0,0,0,.32);--radius-sm:9px;--radius-md:15px;--radius-lg:23px;font-family:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background-color:var(--bg);background-image:radial-gradient(ellipse at 0% 0%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 35%),radial-gradient(ellipse at 100% 90%,rgba(255,255,255,.025),transparent 38%);color:var(--text)}
    body.theme-home{--bg:#090b10;--surface:#121722;--surface-2:#1b2230;--accent:#c7ff50;--accent-grad:linear-gradient(135deg,#d7ff68,#8bbf22);--accent-soft:rgba(199,255,80,.12);--text-muted:#98a2b5;--border:rgba(219,231,255,.11)}
    body.theme-spy{--bg:#090b12;--surface:#10131d;--surface-2:#191d29;--accent:#ff475f;--accent-grad:linear-gradient(135deg,#ff5269,#a91632);--accent-soft:rgba(255,71,95,.13);--text-muted:#a7adbd;--border:rgba(255,88,111,.17);--chat-me:#8b1730;--chat-other:#1d2230}
    body.theme-crocodile{--bg:#071b16;--surface:#0e2921;--surface-2:#17392e;--accent:#b9f66b;--accent-grad:linear-gradient(135deg,#d2ff87,#54bc70);--accent-soft:rgba(185,246,107,.14);--text-muted:#b0c9b6;--border:rgba(176,237,136,.17);--chat-me:#28794c;--chat-other:#153d31}
    body.theme-bunker{--bg:#111316;--surface:#1b2024;--surface-2:#292f34;--accent:#ffc247;--accent-grad:linear-gradient(135deg,#ffd064,#c77b17);--accent-soft:rgba(255,194,71,.13);--text-muted:#b2b6b9;--border:rgba(207,215,219,.16);--chat-me:#7e5015;--chat-other:#2a3036}
    body.theme-munchkin{--bg:#1b100a;--surface:#2b1a11;--surface-2:#412819;--accent:#f8d779;--accent-grad:linear-gradient(135deg,#ffe79a,#bb7b29);--accent-soft:rgba(248,215,121,.15);--text-muted:#d6bd9b;--border:rgba(248,215,121,.2);--chat-me:#795022;--chat-other:#402819;--gold:#ffdb76}
    .main-area{max-width:1240px;padding-inline:clamp(14px,3vw,36px);padding-bottom:calc(104px + var(--safe-bottom))}

    .brand-mark{height:43px;width:43px;border-radius:14px;background:var(--accent-grad);color:#111;font-size:0;position:relative;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 23%,transparent)}
    .brand-mark:after{content:"";width:19px;height:19px;border:2px solid currentColor;border-radius:6px;transform:rotate(45deg);position:absolute;inset:10px}
    .brand-title{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.7px}
    .brand-sub{letter-spacing:.04em;font-size:10px;text-transform:uppercase}
    .balance-pill{background:rgba(255,255,255,.04);border-color:var(--border);padding:9px 13px;font-variant-numeric:tabular-nums}
    .icon-button{background:rgba(255,255,255,.04);border-color:var(--border);border-radius:13px;font-size:0;transition:transform .18s ease,border-color .18s ease,background .18s ease}
    .icon-button:hover{transform:translateY(-2px);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
    .legacy-vector-icon{display:inline-block;flex:0 0 auto;vertical-align:middle}

    .page-heading{margin:28px 0 20px}
    .page-heading h1,.welcome-card h1{font-family:"Space Grotesk","DM Sans",sans-serif;letter-spacing:-1.15px;font-weight:700}

    .eyebrow{letter-spacing:2px;font-size:10px;font-weight:800;color:var(--accent)}

    .section-title .subtle{font-family:"DM Sans",sans-serif;color:var(--text-muted);font-size:11px}
    .panel{background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 95%,white 5%),var(--surface));border-color:var(--border);border-radius:21px;box-shadow:var(--shadow)}
    .btn{border-radius:12px;min-height:45px;font-weight:800;letter-spacing:.005em;transition:transform .17s ease,filter .17s ease,box-shadow .17s ease}
    .btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
    .btn-primary{color:#10130b;background:var(--accent-grad);box-shadow:0 9px 22px color-mix(in srgb,var(--accent) 18%,transparent)}
    .btn-secondary{background:rgba(255,255,255,.055);border-color:var(--border)}
    .btn-ghost{background:transparent;border-color:var(--border)}
    .btn-danger{background:rgba(255,64,82,.1);border-color:rgba(255,64,82,.3);color:#ff9da7}
    .pill{border-radius:8px;letter-spacing:.05em;text-transform:uppercase;font-size:9px;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
    .welcome-card{min-height:292px;padding:clamp(24px,5vw,48px);border-radius:27px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:linear-gradient(90deg,#090c12 0%,rgba(9,12,18,.96) 34%,rgba(9,12,18,.58) 64%,rgba(9,12,18,.18) 100%),linear-gradient(0deg,rgba(9,12,18,.65),transparent 70%),url("https://unsplash.com/photos/1tnS_BVy9Jk/download?force=true") 65% 45%/cover;border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 65px #0005;isolation:isolate}
    .welcome-card:after{content:"";position:absolute;right:22px;bottom:-86px;width:235px;height:235px;border:1px solid rgba(255,255,255,.13);border-radius:50%;opacity:.6;transform:none;box-shadow:0 0 0 28px rgba(255,255,255,.025),0 0 0 56px rgba(255,255,255,.02)}
    .welcome-card .eyebrow{padding:8px 11px;background:rgba(199,255,80,.1);border:1px solid rgba(199,255,80,.22);border-radius:999px;margin-bottom:16px}
    .welcome-card h1{font-size:clamp(31px,5vw,51px);line-height:1.02;margin:0 0 12px;max-width:580px}
    .welcome-card p{font-size:14px;max-width:400px;color:#c7cbd4;line-height:1.7;margin-bottom:23px}
    .game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .game-card{min-height:0;padding:0;border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;transition:transform .23s ease,border-color .23s ease,box-shadow .23s ease;box-shadow:0 12px 26px rgba(0,0,0,.15)}
    .game-card:before{display:none}
    .game-card:hover{transform:translateY(-5px);box-shadow:0 20px 40px #0005;border-color:color-mix(in srgb,var(--game-accent,var(--accent)) 60%,transparent)}
    .game-card .game-card-art{width:100%;height:clamp(145px,22vw,208px);flex:0 0 auto;margin:0;position:relative;isolation:isolate;overflow:hidden;background:#10141b;display:block}
    .game-card .game-card-art:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(4,7,12,.04) 0%,rgba(4,7,12,.08) 38%,rgba(4,7,12,.91) 100%),linear-gradient(125deg,color-mix(in srgb,var(--game-accent) 16%,transparent),transparent 55%);pointer-events:none}
    .game-card .game-art-image{display:block;width:100%;height:100%;position:absolute;inset:0;z-index:0;object-fit:cover;object-position:center;filter:none;opacity:.88;transition:transform .65s cubic-bezier(.2,.7,.2,1),opacity .3s ease}
    .game-card.spy .game-art-image{object-position:center 35%}
    .game-card.crocodile .game-art-image{object-position:center 45%}
    .game-card.bunker .game-art-image{object-position:center 52%}
    .game-card.munchkin .game-art-image{object-position:center 48%}

    .game-card .game-art-halo,.game-card .game-art-fallback{display:none}

    .game-card .game-card-title{display:flex;align-items:center;gap:9px;margin:0 0 8px;width:100%}

    .game-card h3{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:19px;letter-spacing:-.5px;margin:0;color:#f7f8fb}

    .game-card.spy{--game-accent:#ff536b;--game-tint:#a21e3b}
    .game-card.crocodile{--game-accent:#b9f66b;--game-tint:#1b784f}

    #viewRoot{isolation:isolate;min-height:45vh;position:relative}

    body.theme-munchkin #viewRoot:before{background:linear-gradient(180deg,rgba(28,15,8,.88),rgba(28,15,8,.95)),repeating-linear-gradient(90deg,transparent 0 38px,#f8d77908 39px 40px)}
    .game-header,.section-panel{position:relative}
    .section-panel{padding:17px;border-radius:19px;border:1px solid var(--border);background:color-mix(in srgb,var(--surface) 93%,transparent);box-shadow:0 13px 32px #0002;margin-top:15px}

    /* ==============================================================
       ФИНАЛЬНАЯ ПОЛИРОВКА: лёгкие анимации и отдельные персонажи игр.

    :root{--bg:#eee5d1;--surface:#fbf3df;--surface-2:#e8dcc0;--border:#c4b18a;--text:#302719;--text-muted:#675941;--accent:#80613e;--accent-grad:linear-gradient(145deg,#a98758,#755234);--accent-soft:#9d784c20;--chat-me:#e5d4b0;--chat-other:#fff5dd;--shadow:0 3px 0 #5a40241a;color-scheme:light}

    body.theme-home{--bg:#eee5d1;--surface:#fbf3df;--surface-2:#e8dcc0;--border:#c4b18a;--text:#302719;--text-muted:#675941;--accent:#80613e;--accent-grad:linear-gradient(145deg,#a98758,#755234);--accent-soft:#9d784c20;--chat-me:#e5d4b0;--chat-other:#fff5dd}

    body.theme-bunker{--bg:#e2d8b8;--surface:#f3e7c4;--surface-2:#ded0a7;--border:#bca879;--text:#363426;--text-muted:#71684b;--accent:#a37a27;--accent-grad:linear-gradient(145deg,#d5b64e,#9a772a);--accent-soft:#b88c3024;--chat-me:#e8d99c;--chat-other:#fff3d2}

    /* Performance: убрать фильтры и размытия, убрать бесконечные анимации мелких частей. */
    *,*:before,*:after{scroll-behavior:auto!important}

    /* Убираем старую анимацию появления карточек с blur-фильтром — она и создавала ощущение лага/размытия. */
    .game-card,.game-card.character-card{animation:none!important;filter:none!important;will-change:auto!important;transform-style:flat!important;perspective:none!important}
    .game-card .game-card-art,.game-card .game-card-copy{filter:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    .game-card:hover{transition:transform .16s ease,border-color .16s ease!important}



    /* ===== ПАТЧ ЧИТАЕМОСТИ И ПРОИЗВОДИТЕЛЬНОСТИ: бумажные темы без затемнения ===== */
    :root{
      color-scheme:light;
      --radius-sm:7px;--radius-md:10px;--radius-lg:14px;--radius-pill:999px;
      --bg:#efe5cf;--surface:#fbf5e6;--surface-2:#e9dcc0;--border:#c8b58e;
      --text:#352b1f;--text-muted:#695d48;--accent:#76512e;
      --accent-grad:linear-gradient(135deg,#8a653b,#b18a52);--accent-soft:#e9d9b6;
      --chat-me:#d8c49c;--chat-other:#fff8e8;--danger:#9f332a;--gold:#b18534;
      --shadow:0 2px 0 #66502a17;--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    body,body.theme-home{--bg:#efe5cf;--surface:#fbf5e6;--surface-2:#e9dcc0;--border:#c8b58e;--text:#352b1f;--text-muted:#695d48;--accent:#76512e;--accent-grad:linear-gradient(135deg,#8a653b,#b18a52);--accent-soft:#e9d9b6;--chat-me:#d8c49c;--chat-other:#fff8e8;--gold:#b18534;background:var(--bg)!important;color:var(--text)!important}
    body.theme-spy{--bg:#eee5d5;--surface:#fbf4e7;--surface-2:#e5d7bf;--border:#cbb69a;--text:#30271f;--text-muted:#6d5a4e;--accent:#8b3930;--accent-grad:linear-gradient(135deg,#9c4437,#6f3029);--accent-soft:#ead4c8;--chat-me:#e6cbb9;--chat-other:#fff7e9;--gold:#aa7b3e}
    body.theme-crocodile{--bg:#e7e8d2;--surface:#f7f5e3;--surface-2:#dbe0c0;--border:#b7c19a;--text:#2e3525;--text-muted:#5f6b4c;--accent:#54743e;--accent-grad:linear-gradient(135deg,#66854a,#3e6137);--accent-soft:#dce5c8;--chat-me:#d5dfb8;--chat-other:#fcf9e9;--gold:#a18432}
    body.theme-bunker{--bg:#e4e0cf;--surface:#f7f1dd;--surface-2:#ddd7bd;--border:#bdb294;--text:#332f21;--text-muted:#696346;--accent:#927b2c;--accent-grad:linear-gradient(135deg,#b4a044,#82732d);--accent-soft:#e8dfb9;--chat-me:#e4d69a;--chat-other:#fff9e8;--gold:#9b7b29}
    body.theme-munchkin{--bg:#efdbb4;--surface:#fff0cf;--surface-2:#e7c995;--border:#c7a66e;--text:#442b18;--text-muted:#785b39;--accent:#875426;--accent-grad:linear-gradient(135deg,#a86e31,#70431f);--accent-soft:#f0d5a2;--chat-me:#e5c286;--chat-other:#fff7e3;--gold:#a8791f}
    html,body{min-height:100%;background:var(--bg)!important;color:var(--text)!important;transition:none!important}
    body{font-family:Georgia,'Times New Roman',serif!important}
    .brand-title,.page-heading h1,.welcome-card h1,.game-card-title h3,.section-title,.modal-header h2{font-family:Georgia,'Times New Roman',serif!important;letter-spacing:-.2px!important}
    .topbar,.bottom-nav,.desktop-sidebar,.modal-backdrop,.chat-overlay,.toast,.panel,.game-card,.welcome-card,.player-card,.room-card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    .topbar{background:var(--surface)!important;border-bottom:2px solid var(--border)!important;box-shadow:0 2px 0 #6f522019!important}
    .bottom-nav{background:var(--surface)!important;border:1px solid var(--border)!important;box-shadow:0 4px 9px #5b45201a!important}
    .brand-mark,.avatar-xl{background:var(--accent-grad)!important;box-shadow:none!important}
    .welcome-card{background:linear-gradient(145deg,#fff7e5,#ead9b7)!important;border:1px solid var(--border)!important;box-shadow:0 3px 0 #63482017!important}
    .welcome-card h1,.welcome-card p,.welcome-card .eyebrow{color:#3c2d1c!important}
    .welcome-card p{opacity:1!important}
    .welcome-card:after,.welcome-card:before,#viewRoot:before{display:none!important;background-image:none!important;filter:none!important}
    .panel,.section-panel,.info-tile,.player-card,.room-card,.profile-hero,.session-panel,.trait-card,.catastrophe-card,.lobby-hero,.modal-sheet,.item-card,.monster-card,.profile-settings-panel,.section-panel,.market-card{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important;box-shadow:0 2px 0 #5c44201a!important}
    .panel[style*="linear-gradient"],.market-card[style*="linear-gradient"]{background:var(--surface)!important;color:var(--text)!important}

      const shape=(points,fill,stroke=palette.ink,lw=7)=>{ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}};

      const rect=(x,y,w,h,r,fill,stroke=palette.ink,lw=6)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}

      const data=state.roomState||{};const me=(data.players||[]).find(p=>String(p.user_id)===String(myId))||{};const myWord=me.word||null;const role=me.role||'civilian';const roleText={civilian:'МИРНЫЙ',undercover:'ШПИОН',mrwhite:'МИСТЕР УАЙТ'}[role]||'—';const isWhite=role==='mrwhite';const alive=me.is_alive!==false;const showWord=!!myWord&&role!=='spectator';const speaker=(data.players||[]).find(p=>String(p.user_id)===String(data.room?.current_speaker_id))||null;const canVote=(data.room?.status==='voting')&&alive&&!me.is_spectator&&state.votedRound!==data.room?.current_round;return `${gameHeader()}<div class="row wrap" style="justify-content:center"><span class="spy-role">${esc(roleText)}</span><span class="pill"><span class="status-dot" style="background:${alive?'#34d399':'#64748b'}"></span>${alive?'В игре':'Выбывший'}</span></div><div class="card-stage"><div class="card-3d" data-action="flip-card" role="button" tabindex="0" aria-label="Перевернуть секретную карточку"><div class="card-face front"><div class="card-character-inline spy-character-inline"><span class="card-person-art">${gameCharacterArt('spy',104)}</span><span class="card-symbol">${drawIcon('spy',32)}</span></div><div style="z-index:1;font-weight:900;letter-spacing:2px;margin-top:12px">СЕКРЕТНАЯ КАРТА</div><div style="z-index:1;font-size:11px;color:#cbd5e1;margin-top:8px">Нажми, чтобы открыть</div></div><div class="card-face back"><div class="card-back-title">${isWhite?'ТВОЯ РОЛЬ':'СЕКРЕТНОЕ СЛОВО'}</div><div class="secret-word">${showWord?esc(myWord):isWhite?'ТЫ БЕЗ СЛОВА':'СЕКРЕТ СКРЫТ'}</div><p class="muted small">${isWhite?'Блефуй и попробуй угадать слово мирных':role==='undercover'?'Не выдай, что твоё слово отличается':'Описывай слово, не называя его'}</p></div></div></div><div class="game-info-grid"><div class="info-tile"><strong>${Number(data.room?.current_round||1)}</strong><span>Раунд</span></div><div class="info-tile"><strong>${(data.players||[]).filter(p=>p.is_alive!==false&&!p.is_spectator).length}</strong><span>В игре</span></div><div class="info-tile"><strong>${data.room?.status==='voting'?drawIcon('vote',19):data.room?.status==='discussion'?drawIcon('messages',19):drawIcon('eye',19)}</strong><span>${statusLabel(data.room?.status)}</span></div></div>${speaker?`<div class="turn-banner" style="margin-top:14px"><div class="turn-avatar">${drawIcon('mic',21)}</div><div><strong>Сейчас говорит: ${esc(userName(speaker))}</strong><p>Опиши своё слово одной фразой, не называя его.</p></div></div>`:''}${data.room?.status==='voting'?`<div class="panel" style="padding:15px;margin-top:15px"><strong>${drawIcon('vote',17)} Голосование</strong><p class="muted small">Выбери игрока, которого считаешь шпионом.</p><button class="btn btn-primary btn-wide" data-action="open-vote" ${!canVote?'disabled':''}>${state.votedRound===data.room?.current_round?'Голос уже отдан':'Открыть голосование'}</button></div>`:''}${role==='mrwhite'&&data.room?.status==='voting'?`<div class="panel" style="padding:15px;margin-top:15px"><strong>Попробуй угадать слово мирных</strong><form data-form="white-guess" class="row" style="margin-top:10px"><input class="field grow" name="guess" maxlength="100" placeholder="Твоё предположение" required><button class="btn btn-primary" type="submit">Ответить</button></form></div>`:''}${!alive?`<div class="panel" style="padding:14px;margin-top:14px"><p class="muted">Ты выбыл из текущего раунда. Дождись следующего результата.</p></div>`:''}<div class="row" style="margin-top:16px"><button class="btn btn-danger grow" data-action="surrender">Сдаться</button><button class="btn btn-secondary" data-action="open-chat">💬 Чат</button></div>${renderWinnerIfAny()}`;
    }
    function roleLabel(role){return ({civilian:'МИРНЫЙ',undercover:'ШПИОН',mrwhite:'МИСТЕР УАЙТ',spectator:'НАБЛЮДАТЕЛЬ'})[role]||'РОЛЬ НЕ НАЗНАЧЕНА'}
    function statusLabel(status){return ({waiting:'Ожидание',dice:'Кубик',playing:'Игра',discussion:'Обсуждение',voting:'Голосование',finished:'Завершена'})[status]||status||'—'}
    function renderCrocodile(){// FIX: слово видно ведущему только через room.pending_guess; для остальных — заглушка.
      const data=state.roomState||{};const room=data.room||{};const isSpeaker=String(room.current_speaker_id)===String(myId);const word=isSpeaker?(room.pending_guess||'…'):'???';const speaker=(data.players||[]).find(p=>String(p.user_id)===String(room.current_speaker_id));return `${gameHeader()}<div class="turn-banner"><div class="turn-avatar crocodile-turn-avatar"><span class="turn-person-art">${gameCharacterArt('crocodile',64)}</span></div><div class="grow"><strong>${isSpeaker?'Ты объясняешь слово':`ОБЪЯСНЯЕТ: ${esc(userName(speaker||{}))}`}</strong><p>${isSpeaker?'Объясняй в чате, не называй слово и однокоренные слова.':'Пиши варианты в чат — первый правильный ответ выиграет раунд.'}</p></div></div><div class="card-stage"><div class="card-3d" data-action="flip-card" role="button" tabindex="0" aria-label="Открыть карточку слова"><div class="card-face front"><div class="card-character-inline crocodile-character-inline"><span class="card-person-art">${gameCharacterArt('crocodile',104)}</span><span class="card-symbol">${drawIcon('crocodile',30)}</span></div><div style="z-index:1;font-weight:900;letter-spacing:2px;margin-top:10px">${isSpeaker?'ТВОЁ СЛОВО':'СЛОВО ВЕДУЩЕГО'}</div><div style="z-index:1;font-size:11px;color:#cbd5e1;margin-top:8px">${isSpeaker?'Нажми, чтобы увидеть':'Попробуй угадать!'}</div></div><div class="card-face back"><div class="card-back-title">${isSpeaker?'СЕКРЕТНОЕ СЛОВО':'ТЫ УГАДЫВАЕШЬ'}</div><div class="secret-word">${esc(word)}</div><p class="muted small">${isSpeaker?'Не произноси и не пиши слово.':'Напиши догадку в общий чат.'}</p></div></div></div><div class="game-info-grid"><div class="info-tile"><strong>${Number(room.current_round||1)}</strong><span>Раунд</span></div><div class="info-tile"><strong>${(data.players||[]).length}</strong><span>Игроков</span></div><div class="info-tile"><strong>${drawIcon('messages',19)}</strong><span>Ответы в чате</span></div></div>${isSpeaker?`<button class="btn btn-danger btn-wide" data-action="surrender" style="margin-top:16px">СДАТЬСЯ</button>`:`<button class="btn btn-primary btn-wide" data-action="open-chat" style="margin-top:16px">${drawIcon('scroll',16)} Написать вариант в чат</button>`}${renderWinnerIfAny()}`;
    }
    const BUNKER_TRAITS=[['profession','briefcase','ПРОФЕССИЯ'],['health','heart','ЗДОРОВЬЕ'],['baggage','backpack','БАГАЖ'],['fact','brain','ФАКТ']];
    function renderBunker(){// FIX: word — это JSON-поле участника, а катастрофа — room.pending_guess.
      const data=state.roomState||{};const room=data.room||{};const me=(data.players||[]).find(p=>String(p.user_id)===String(myId))||{};let traits={};try{traits=JSON.parse(me.word||'{}')}catch{}const disaster=room.pending_guess||'—';const status=room.status;const canVote=(status==='voting'||status==='discussion')&&me.is_alive&&!me.is_spectator&&state.votedRound!==room.current_round;return `${gameHeader()}<section class="catastrophe-card"><div class="catastrophe-icon">${drawIcon('alert',34)}</div><div><div class="eyebrow" style="color:#fbbf24;margin-bottom:5px">ГЛОБАЛЬНАЯ УГРОЗА</div><h2>${esc(disaster)}</h2><p>Кто достоин места в убежище?</p></div></section><div class="section-title">Твои характеристики <span class="subtle">Нажми на карту</span></div><div class="trait-grid">${BUNKER_TRAITS.map(([key,icon,label],i)=>{const aliases={profession:['profession','Профессия','Профессии'],health:['health','Здоровье'],baggage:['baggage','Багаж'],fact:['fact','Факты','Факт']};let val;for(const k of aliases[key])if(traits[k]!==undefined){val=traits[k];break}const open=val!==undefined&&val!==null;return `<button class="trait-card ${open?'':'not-dealt'}" data-action="flip-trait" data-trait="${key}" style="animation-delay:${i*.15}s" aria-label="${label}"><span class="trait-inner"><span class="trait-face trait-front"><span class="trait-icon">${drawIcon(icon,36)}</span><strong>${label}</strong><span style="font-size:10px;margin-top:8px">${open?'Нажми, чтобы открыть':'Ожидание раздачи'}</span></span><span class="trait-face trait-back"><small>${label}</small><strong>${open?esc(typeof val==='string'?val:val.name||val.value||'Характеристика'):'Карта не выдана'}</strong><span>${open?'Твоя тайна. Раскрывай её в удобный момент.':'Данные выдаются сервером после старта игры.'}</span></span></span></button>`}).join('')}</div><section class="panel timer-card" style="margin-top:16px"><div class="timer-ring" id="phaseTimer">—</div><div class="grow timer-copy"><strong>${status==='voting'?`${drawIcon('vote',17)} Время голосования`:status==='discussion'?`${drawIcon('messages',17)} Время обсуждения`:statusLabel(status)}</strong><p>${status==='voting'?'Выбери участника для исключения.':status==='discussion'?'Рассказывай о своих характеристиках и слушай других.':'Ожидаем состояние игры от сервера.'}</p><div class="timer-track"><span id="phaseProgress" style="width:100%"></span></div></div></section>${status==='voting'||status==='discussion'?`<button class="btn btn-primary btn-wide" data-action="open-vote" style="margin-top:14px" ${!canVote?'disabled':''}>${state.votedRound===room.current_round?'Голос уже отдан':'🗳️ Голосовать'}</button>`:`<button class="btn btn-secondary btn-wide" data-action="open-chat" style="margin-top:14px">💬 Обсуждение в чате</button>`}<button class="btn btn-danger btn-wide" data-action="surrender" style="margin-top:9px">Сдаться</button>${renderWinnerIfAny()}`;
    }

    // ============ МАНЧКИН: ПАНЕЛЬ ГЕРОЯ, МОНСТРЫ И КАРТЫ ============
    function renderMunchkin(){// FIX: данные игрока — из players, золото и монстр — только из munchkin_data.
      const data=state.roomState||{};const me=(data.players||[]).find(p=>String(p.user_id)===String(myId))||{};const md=data.munchkin_data||{hand:[],equipped:[],gold:0,active_monster:null};const level=Number(me.munchkin_level||1);const power=Number(me.munchkin_power||level);const gold=Number(md.gold||0);const phase=data.room?.turn_phase||'door';const isMyTurn=String(data.room?.current_speaker_id)===String(myId);const monster=md.active_monster||null;const hand=Array.isArray(md.hand)?md.hand:[];const equipped=Array.isArray(md.equipped)?md.equipped:[];const bonus=Math.max(0,power-level);const showDoor=phase==='door'&&isMyTurn;const showCombat=phase==='combat'&&isMyTurn&&!!monster;const showTreasure=phase==='treasure'&&isMyTurn;const stage=monster&&phase==='combat'?`<div class="section-title">Противник <span class="pill">${drawIcon('swords',14)} БОЙ</span></div><section class="gold-card monster-card" id="activeMonsterCard" data-monster-id="${esc(monster.id??monster.name)}"><div class="monster-identity"><span class="monster-identity-icon">${monsterEmoji(monster.icon)}</span><h2 class="monster-title">${esc(monster.name||'Монстр')}</h2></div><div class="monster-art-wrap"><span class="monster-character-image fantasy-character-art">${gameCharacterArt('munchkin',174)}</span><span class="monster-icon-fallback">${monsterEmoji(monster.icon)}</span><span class="monster-art-caption">ПЕРСОНАЖ ПОДЗЕМЕЛЬЯ</span></div><div class="monster-badstuff"><strong>${drawIcon('skull',14)} ПОСЛЕДСТВИЯ НЕУДАЧНОГО ПОБЕГА</strong><br>${esc(monster.badstuff||'Эффект определяется сервером')}</div><div class="monster-stats"><div><strong>${Number(monster.power||0)}</strong><span>СИЛА</span></div><div><strong>${Number(monster.levels||1)}</strong><span>УРОВНИ</span></div><div><strong>${Number(monster.treasures||1)}</strong><span>СОКРОВИЩА</span></div></div>${showCombat?`<div class="monster-actions"><button class="btn btn-danger" data-action="munchkin" data-munchkin-action="fight">⚔️ БОЙ</button><button class="btn btn-secondary" data-action="munchkin" data-munchkin-action="run">💨 ПОПЫТАТЬСЯ СБЕЖАТЬ</button></div>`:''}</section>`:'';return `${gameHeader()}<div class="hero-stats"><div class="hero-stat"><span class="stat-emoji">${drawIcon('star',18)}</span><strong>${level}</strong><span>УРОВЕНЬ</span></div><div class="hero-stat"><span class="stat-emoji">${drawIcon('swords',18)}</span><strong>${power}</strong><span>СИЛА</span></div><div class="hero-stat"><span class="stat-emoji">${drawIcon('shield',18)}</span><strong>+${bonus}</strong><span>ЭКИПИРОВКА</span></div><div class="hero-stat"><span class="stat-emoji">${drawIcon('coin',18)}</span><strong>${gold}</strong><span>ЗОЛОТО</span></div></div><div class="munchkin-hero-info"><span>${drawIcon('wand',16)} ${esc(me.munchkin_class||'Без класса')}</span><span class="muted">·</span><span>${drawIcon('user',16)} ${esc(me.munchkin_race||'Без расы')}</span><span class="top-spacer"></span><button class="btn btn-gold btn-small" data-action="open-market">💰 Рынок</button></div><div style="margin:10px 0">${isMyTurn&&phase==='door'?'<span class="status-pill" style="animation:focusFloat 2s infinite">ТВОЙ ХОД</span>':''}</div>${stage}<section class="section-panel"><div class="section-title"><span>${phase==='treasure'?`${drawIcon('trophy',17)} СОКРОВИЩА`:phase==='combat'?`${drawIcon('swords',17)} БОЙ`:`${drawIcon('door',17)} ДВЕРЬ`}</span><span class="pill">${isMyTurn?'ТВОЙ ХОД':'ХОД СОПЕРНИКА'}</span></div><p class="muted small">${phase==='treasure'?'Забери награду, затем передай ход.':phase==='combat'?'Доступные действия отображаются в соответствии с ходом и активным монстром.':'Открой дверь или отправляйся взять золото.'}</p><div class="stack" style="margin-top:13px">${showDoor?`<button class="btn btn-gold btn-wide" data-action="munchkin" data-munchkin-action="door">🚪 ВЫШИБИТЬ ДВЕРЬ</button><button class="btn btn-secondary btn-wide" data-action="munchkin" data-munchkin-action="loot">🧰 ВЗЯТЬ ЗОЛОТО (+50)</button>`:''}${showTreasure?`<button class="btn btn-gold btn-wide" data-action="munchkin" data-munchkin-action="treasure">🎁 ПОЛУЧИТЬ СОКРОВИЩЕ</button>`:''}</div></section><section class="section-panel"><div class="section-title">ЭКИПИРОВКА <span class="subtle">${equipped.length} карт</span></div>${equipped.length?`<div class="card-rail">${equipped.map((c,i)=>itemCard(c,'equipped',i)).join('')}</div>`:`<div class="hand-empty">Надетых предметов пока нет. Найди экипировку в колоде сокровищ.</div>`}</section><section class="section-panel"><div class="section-title">В РУКЕ (${hand.length}) <span class="subtle">Лимит проверяет сервер</span></div>${hand.length?`<div class="card-rail">${hand.map((c,i)=>itemCard(c,c.card_type==='monster'?'monster':c.deck_type==='treasure'||c.card_type==='item'?'treasure':'door',i).replace('class="item-card ', 'class="item-card hand-card ').replace('style="animation-delay:', 'style="animation:dealCard3D .6s both;animation-delay:')).join('')}</div>`:`<div class="hand-empty">${drawIcon('hand',25)}<br>В руке пока пусто<br>Карты появятся после добора.</div>`}</section><div class="row wrap" style="margin-top:14px"><button class="btn btn-secondary grow" data-action="open-market">💰 Рынок</button><button class="btn btn-danger" data-action="surrender">Сдаться</button></div>${renderWinnerIfAny()}`;
    }
    function monsterEmoji(icon){const icons={orc:'skull',civilian:'user',ghost:'ghost',ogre:'skull',crab:'crocodile',goblin:'skull',package:'package',gem:'gem',skeleton:'skull',dragon:'dragon',monster:'sparkles',horse:'user'};return drawIcon(icons[String(icon||'').toLowerCase()]||'skull',58,'monster-painted')}
    function itemCard(card,variant='hand',index=0){const type=card.card_type||card.type||'item';const isMonster=type==='monster'||card.is_monster||variant==='monster';const isTreasure=variant==='treasure'||card.deck_type==='treasure'||type==='item';const icon=isMonster?monsterEmoji(card.icon):type==='curse'?drawIcon('skull',26):type==='class'?drawIcon('wand',26):type==='race'?drawIcon('user',26):isTreasure?drawIcon('gem',26):drawIcon('card',26);const cls=isMonster?'monster':isTreasure?'treasure':'';const cardId=card.id??card.card_instance_id??card.card_id;return `<button class="item-card ${cls}" data-action="card-click" data-card-id="${esc(cardId)}" data-card-location="${esc(card.location||variant)}" style="animation-delay:${index*.08}s" title="${esc(card.name)}"><span class="item-type">${isMonster?'ДВЕРЬ · МОНСТР':isTreasure?'СОКРОВИЩЕ':'КАРТА ДВЕРИ'}</span><span class="item-icon">${icon}</span><span class="item-name">${esc(card.name||'Карта')}</span><span class="item-meta"><span class="mini-badge">${Number(card.power||card.bonus||0)>0?`+${Number(card.power||card.bonus)}`:'Карта'}</span><span class="mini-badge">${Number(card.price)>0?`${Number(card.price)} ${drawIcon('coin',12)}`:''}</span></span></button>`}
    function renderWinnerIfAny(){const result=state.roomState?.result||state.roomState?.game_result||null;if(!isFinished()&&!result)return '';const winner=result?.winner||state.roomState?.winner||null;return `<section class="panel" style="padding:22px;text-align:center;margin-top:16px"><div class="winner-trophy">${drawIcon('trophy',42)}</div><h2 style="margin:8px 0">${esc(winner?.username||winner?.name||'Игра завершена')}</h2><p class="muted small">${esc(result?.message||'Результат подтверждён сервером.')}</p><button class="btn btn-primary btn-wide" data-action="return-home">Вернуться на главную</button></section>`}
    function renderEmptyGame(){return `${heading('Игра','Получаем актуальное состояние…')}<div class="panel empty-state"><div class="typing-dots"><i></i><i></i><i></i></div><p>Синхронизация с сервером</p><button class="btn btn-secondary" data-action="refresh-state">Обновить</button></div>`}

    // ============ ПРОФИЛЬ И РЫНОК ============
    function renderProfile(){setTheme('theme-home');const p=state.profile||{};const guest=p.is_guest||p.kind==='guest'||isGuest;const displayName=p.displayName||safeStorage.get('displayName')||'';return `${heading('Твой профиль','Имя, статистика и состояние игровой сессии','ПРОФИЛЬ')}<section class="panel profile-hero"><div class="avatar-xl">${esc((userName(p).trim()[0]||'И').toUpperCase())}</div><h2 style="margin:0 0 5px">${esc(userName(p))}</h2><div class="muted small">${guest?'Гостевая сессия':`Telegram ID: ${esc(myId||'—')}`}</div><div class="profile-stats"><div class="stat-box"><strong>${Number(p.balance||0)}</strong><span>Баланс</span></div><div class="stat-box"><strong>${Number(p.games_played||0)}</strong><span>Сыграно игр</span></div><div class="stat-box"><strong>${state.room?1:0}</strong><span>Активная комната</span></div></div><div class="divider"></div><button class="btn btn-secondary btn-wide" data-action="refresh-profile">${drawIcon('refresh',17)} Обновить профиль</button></section><div class="section-title">Персонализация</div><form class="panel stack profile-settings-panel" data-form="profile-settings"><label class="small muted" for="displayNameInput">Отображаемое имя</label><input class="field" id="displayNameInput" name="displayName" maxlength="40" value="${esc(displayName)}" placeholder="Как тебя показывать в комнате"><button class="btn btn-primary btn-wide" type="submit">Сохранить имя</button><p class="muted small">Адрес сервера и ключ подключения задаются в технической конфигурации приложения и не редактируются в профиле.</p></form><div class="section-title">Сессия</div><section class="panel session-panel"><div class="row"><span>Авторизация</span><span class="top-spacer"></span><span class="pill">${guest?'Гость':'Telegram'}</span></div><div class="divider"></div><div class="row"><span class="muted">Текущая комната</span><span class="top-spacer"></span><strong>${state.room?esc(roomLabel(state.room)):'Нет'}</strong></div><p class="muted small" style="line-height:1.5;margin:14px 0 0">Данные подключения не хранятся в профиле пользователя.</p></section>`}

    function renderRoomState(newMessages=[]){const data=state.roomState||{};const room=data.room||{};const me=(data.players||[]).find(p=>String(p.user_id)===String(myId));const md=data.munchkin_data||{};const hash=JSON.stringify({s:room.status,p:room.turn_phase,sp:room.current_speaker_id,r:room.current_round,m:room.monster_name,g:room.pending_guess,h:room.host_id,hand:(md.hand||[]).map(c=>c.id),eq:(md.equipped||[]).map(c=>c.id),gold:md.gold,activeMonster:md.active_monster?[md.active_monster.name,md.active_monster.power,md.active_monster.levels,md.active_monster.treasures]:null,me:me?[me.role,me.word,me.munchkin_level,me.munchkin_power,me.munchkin_gold,me.is_alive,me.is_spectator]:null,pl:(data.players||[]).map(p=>[p.user_id,p.username,p.dice_roll,p.is_alive,p.is_spectator,p.voted_round])});

      const players=data.players||[];const allRolled=players.length>0&&players.every(p=>Number(p.dice_roll||0)>0);const board=document.getElementById('diceScoreboard');const rollBtn=document.getElementById('rollDiceBtn');if(board){board.style.display=allRolled?'flex':'none';board.innerHTML=allRolled?players.slice().sort((a,b)=>Number(b.dice_roll||0)-Number(a.dice_roll||0)).map(p=>`<div class="dice-score ${Number(p.dice_roll||0)===Math.max(...players.map(x=>Number(x.dice_roll||0)))?'leader':''}"><span>${esc(userName(p))}${String(p.user_id)===String(myId)?' · ты':''}</span><strong>${Number(p.dice_roll||0)}</strong></div>`).join(''):''}if(rollBtn){rollBtn.style.display=allRolled?'none':'';rollBtn.disabled=!!state.diceRolling||Number(me?.dice_roll||0)>0}

    // ============ ЧАТ: БЕЗОПАСНОЕ ОТОБРАЖЕНИЕ И ГОЛОС ============
    function openChat(){if(!state.roomId){toast('Сначала войди в комнату.','error');return}state.chatOpen=true;const root=$('#chatRoot');root.innerHTML=`<section class="chat-overlay" role="dialog" aria-modal="true" aria-label="Чат комнаты"><header class="chat-header"><button class="icon-button" data-action="close-chat" aria-label="Закрыть чат"><span class="draw-icon icon-back" style="--icon-size:18px" aria-hidden="true"><i class="draw-shape"></i><i class="draw-detail"></i><i class="draw-detail-two"></i></span></button><div class="grow"><strong>Чат комнаты</strong><div class="small muted">${esc(roomLabel(state.room))}</div></div><span class="pill">${esc(GAME_META[state.game]?.title||'Игра')}</span></header><div class="chat-messages" id="chatMessages" aria-live="polite"><div class="empty-state">Загружаем сообщения…</div></div><form class="chat-compose" data-form="chat"><textarea class="field grow" name="message" rows="1" maxlength="${CONFIG.maxMessageLength}" placeholder="Сообщение…" aria-label="Сообщение" required></textarea><button type="button" class="icon-button" data-action="toggle-voice" aria-label="Записать голосовое сообщение">${drawIcon('mic',18)}</button><button type="submit" class="icon-button" aria-label="Отправить сообщение">${drawIcon('send',18)}</button></form></section>`;hydrateDrawnIcons(root);replaceLeadingButtonGlyphs(root);hydrateLegacyIcons(root);const chatBox=$('#chatMessages',root);if(chatBox){chatBox.replaceChildren();for(const cachedMessage of state.messageCache)chatBox.append(renderChatMessage(cachedMessage));chatBox.scrollTop=chatBox.scrollHeight}refreshRoomState(true);const input=$('textarea[name="message"]',root);input?.focus()} // FIX: чат рендерит сохранённый messageCache и не теряет сообщения, пришедшие до открытия.

    function appendMessages(messages){if(!Array.isArray(messages))return;if(!state.seenMsgIds)state.seenMsgIds=new Set();const fresh=[];for(const m of messages){const key=String(m?.id??`${m?.user_id}:${m?.created_at}:${m?.text}`);if(state.seenMsgIds.has(key))continue;state.seenMsgIds.add(key);state.messageCache.push(m);fresh.push(m);const id=Number(m?.id||0);if(Number.isFinite(id)&&id>state.sinceId)state.sinceId=id;if(Number.isFinite(id)&&id>state.chatSinceId)state.chatSinceId=id}if(!state.chatOpen||!fresh.length)return;const box=$('#chatMessages');if(!box)return;const wasNear=box.scrollHeight-box.scrollTop-box.clientHeight<75;if(box.querySelector('.empty-state'))box.replaceChildren();for(const m of fresh)box.append(renderChatMessage(m));if(wasNear||state.chatPinnedBottom)box.scrollTop=box.scrollHeight}

    function renderChatMessage(msg){const me=String(msg.user_id)===String(myId);const system=!!msg.is_system||!!msg.is_npc||!!msg.is_bot||!!msg.is_ai||['system','npc','narrator','bot','ai'].includes(String(msg.sender_type||msg.author_type||'').toLowerCase());const article=document.createElement('article');article.className=`chat-message${me?' mine':''}${system?' system npc-message':''}`;if(system)article.dataset.voiceText=String(msg.text||'');if(!system){const author=document.createElement('div');author.className='chat-author';author.textContent=msg.username||'Игрок';article.append(author)}const bubble=document.createElement('div');bubble.className='chat-bubble';if(msg.is_voice&&msg.voice_url){const row=document.createElement('div');row.className='chat-voice';const icon=document.createElement('span');icon.className='chat-voice-icon';icon.innerHTML=drawIcon('mic',18);const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=msg.voice_url;row.append(icon,audio);bubble.append(row)}else if(system){const inner=document.createElement('div');inner.className='npc-message-inner';const avatar=document.createElement('span');avatar.className='npc-avatar';avatar.innerHTML=gameCharacterArt(normalizeGame(state.game)||'spy',50);const content=document.createElement('div');content.className='npc-message-content';const author=document.createElement('div');author.className='npc-message-author';author.textContent=msg.username||msg.author_name||({spy:'Оперативный штаб',crocodile:'Ведущий Крокодил',bunker:'Система бункера',munchkin:'Глашатай подземелья'}[normalizeGame(state.game)]||'Игровой ведущий');const textNode=document.createElement('span');textNode.className='npc-message-text';const text=String(msg.text||'');content.append(author,textNode);const speak=document.createElement('button');speak.type='button';speak.className='npc-speak-button';speak.dataset.action='speak-message';speak.setAttribute('aria-label','Озвучить сообщение');speak.title='Прочитать вслух';speak.innerHTML=drawIcon('volume2',16);inner.append(avatar,content,speak);bubble.append(inner);const created=msg.created_at?Date.parse(msg.created_at):NaN;const animate=!window.matchMedia('(prefers-reduced-motion: reduce)').matches&&Number.isFinite(created)&&Date.now()-created<5000;if(animate)typewriterMessage(textNode,text);else textNode.textContent=text}else bubble.textContent=msg.text||'';article.append(bubble);return article}
    function typewriterMessage(target,text){target.textContent='';target.classList.add('typing-text');const status=document.createElement('span');status.className='npc-typing-status';status.setAttribute('aria-label','Ведущий печатает');status.innerHTML='печатает <i></i><i></i><i></i>';target.before(status);const cursor=document.createElement('i');cursor.className='typewriter-cursor';cursor.setAttribute('aria-hidden','true');target.after(cursor);const chars=Array.from(String(text||''));let index=0;const step=()=>{if(!target.isConnected){cursor.remove();status.remove();return}const n=Math.min(chars.length,index+1);target.textContent=chars.slice(0,n).join('');index=n;if(index<chars.length){window.setTimeout(step,Math.max(12,Math.min(28,1200/Math.max(chars.length,1))))}else{target.classList.remove('typing-text');cursor.remove();status.remove()}};step()}
    function speakSystemMessage(raw){const text=String(raw||'').trim();if(!text)return;if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance){toast('Озвучка недоступна в этом браузере.','info');return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';const voiceStyle={spy:{rate:.92,pitch:.78},crocodile:{rate:1.08,pitch:1.18},bunker:{rate:.88,pitch:.82},munchkin:{rate:.98,pitch:1.03}}[normalizeGame(state.game)]||{rate:1,pitch:1};u.rate=voiceStyle.rate;u.pitch=voiceStyle.pitch;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>/^ru(-|_)/i.test(v.lang))||null;window.speechSynthesis.speak(u)}catch{toast('Не удалось озвучить сообщение.','error')}} // Озвучка запускается только по нажатию, без автоматического воспроизведения.
    async function sendMessage(text){const trimmed=String(text||'').trim();if(!trimmed)return;if(trimmed.length>CONFIG.maxMessageLength){toast(`Максимум ${CONFIG.maxMessageLength} символов.`,'error');return}try{await api(`/rooms/${state.roomId}/message`,{method:'POST',body:{text:trimmed}});await refreshRoomState(false)}catch(e){toast(e.message,'error')}} // FIX: сообщение отправляется в точном формате {text}; сервер остаётся источником истины.
    async function toggleVoice(){if(state.recording&&state.recording.state==='recording'){state.recording.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Запись голоса не поддерживается этим браузером.','error');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});state.recordingStream=stream;let mime='audio/webm';if(!MediaRecorder.isTypeSupported(mime))mime='audio/mp4';state.voiceMime=mime;const recorder=new MediaRecorder(stream,MediaRecorder.isTypeSupported(mime)?{mimeType:mime}:undefined);const chunks=[];recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());state.recordingStream=null;state.recording=null;if(!chunks.length)return;const blob=new Blob(chunks,{type:recorder.mimeType||mime});if(blob.size>5*1024*1024){toast('Голосовое сообщение превышает 5 МБ.','error');return}try{const base64=await blobToBase64(blob);const data=await api(`/rooms/${state.roomId}/voice`,{method:'POST',body:{base64}});await refreshRoomState(false);toast('Голосовое сообщение отправлено.','success')}catch(e){toast(e.message,'error')}};recorder.start();state.recording=recorder;toast('Запись началась. Нажми на микрофон ещё раз, чтобы отправить.','info',4000);const btn=$('[data-action="toggle-voice"]');if(btn){btn.innerHTML=drawIcon('close',18);btn.setAttribute('aria-label','Остановить запись и отправить')}recorder.addEventListener('stop',()=>{const b=$('[data-action="toggle-voice"]');if(b){b.innerHTML=drawIcon('mic',18);b.setAttribute('aria-label','Записать голосовое сообщение')}})}catch(e){toast(`Не удалось включить микрофон: ${e.message}`,'error')}} // FIX: /voice принимает только {base64}; сообщение читается повторно из /state.
    function blobToBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(new Error('Не удалось прочитать аудиофайл'));reader.readAsDataURL(blob)})}

    function showModal(title,subtitle,body,{actions='',className=''}={}){state.modal={title,subtitle};const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal-sheet ${className}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-grab"></div><header class="modal-header"><div class="grow"><h2 id="modalTitle">${esc(title)}</h2><p>${esc(subtitle||'')}</p></div><button class="icon-button modal-close" data-action="close-modal" aria-label="Закрыть окно">✕</button></header><div class="modal-body">${body}</div>${actions?`<footer class="modal-actions">${actions}</footer>`:''}</section></div>`;hydrateDrawnIcons(root);replaceLeadingButtonGlyphs(root);const backdrop=$('.modal-backdrop',root);backdrop?.addEventListener('click',e=>{if(e.target===backdrop)closeModal()})}
    function closeModal(result=false){const resolver=state.modalResolve;state.modalResolve=null;state.modal=null;state.selectedVote=null;$('#modalRoot').replaceChildren();if(resolver)resolver(!!result)} // FIX: Escape/закрытие разрешает confirm promise значением false.

        sections:[
          {title:'Ход раунда',items:['Игроки: 2–20. Сервер выбирает ведущего и выдаёт слово только ему. Остальные видят рубашку карточки и имя ведущего.','Ведущий объясняет слово в общем чате. Нельзя произносить или писать само слово и однокоренные слова.','Остальные отправляют предположения в чат. Сравнение ответа проводится на сервере без учёта регистра и лишних пробелов.','Первый игрок с правильным ответом становится следующим ведущим. Повторное завершение раунда запрещено.','Если ведущий сдаётся или покидает комнату, сервер выбирает следующего участника по порядку ротации.']},

        intro:'Вариант Манчкина по ТЗ Игрового Хаба использует серверный каталог монстров и карт. Базовый принцип оригинала — открывать двери, сражаться, получать сокровища и достигнуть 10-го уровня.',
        sections:[

          {title:'Фазы хода',items:['ДВЕРЬ: «Вышибить дверь» берёт карту Двери и вскрывает её. Монстр запускает бой, проклятие применяется сразу, остальные карты разрешается сыграть по их типу и требованиям.','ВЗЯТЬ ЗОЛОТО: вместо двери получить +50 золотых и завершить ход согласно правилам проекта.','БОЙ: сравнивается сила игрока и монстра с учётом экипировки, класса, расы, усилителей и эффектов. Победа требует строго большей силы; Воин выигрывает при ничьей, когда применимо его правило.','ПОБЕГ: сервер бросает кубик 1–6. Базово 5–6 означает успех, 1–4 — непотребство; расовые бонусы и специальные эффекты применяются только при допустимости.','СОКРОВИЩА: после победы начисляются уровни по награде монстра, базовые 100 золотых и карты сокровищ. Сервер проверяет победу на 10-м уровне и не выдаёт награду повторно.']},

          {title:'Карты и бой',items:['Слоты экипировки, ограничения классов и рас, временные эффекты, проклятия, усилители и одноразовые зелья проверяются сервером.','Карта может находиться только в одном месте: в колоде, на руке, в экипировке, в сбросе или в текущем бою. Два места одновременно запрещены.','Карта «Пара» добавляет отдельного второго монстра, которого также требуется победить. Количество сокровищ не опускается ниже нуля.','Последствия неудачного побега может требовать выбора карты или игрока; сервер создаёт состояние выбора и проверяет ответ.']}

    };
    function rulesSectionHtml(section){const title=esc(section.title);const list=section.items?.length?`<ul>${section.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';const tags=section.tags?.length?`<div class="rule-tags">${section.tags.map(x=>`<span class="rule-tag">${esc(Array.isArray(x)?x.join(' / '):x)}</span>`).join('')}</div>`:'';if(section.collapsed)return `<details class="rule-section"><summary style="cursor:pointer;font-size:13px;font-weight:800">${title} <span class="muted">(${section.items.length})</span></summary>${list}${tags}</details>`;return `<section class="rule-section"><h3>${drawIcon('book',17)} ${title}</h3>${list}${tags}</section>`}
    function showRules(game){const normalized=normalizeGame(game)||state.game||'spy';const m=GAME_META[normalized];const book=HUB_RULEBOOK[normalized];if(!m||!book)return;const sections=book.sections.map(rulesSectionHtml).join('');const sources=`<section class="rule-section"><h3>${drawIcon('book',17)} Источники и правила</h3><p>Ссылки ниже ведут на внешние правила оригинальных игр. Если механика Игрового Хаба отличается (например, фазы, время, баллы или состав карт), приоритет у правил проекта и ответов сервера.</p><div class="rule-source-links">${book.sources.map(([title,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${drawIcon('arrowUpRight',14)} ${esc(title)}</a>`).join('')}</div></section>`;const body=`<div class="rulebook"><div class="rule-note">${drawIcon('shield',16)} ${esc(book.intro)}</div><section class="rule-section"><h3>${drawIcon('users',17)} Параметры комнаты</h3><div class="rule-tags"><span class="rule-tag">Игроков: ${m.min}–${m.max}</span><span class="rule-tag">Язык: русский</span><span class="rule-tag">Состояние: серверное</span></div><p style="margin-top:10px">Сетевая партия требует настроенного API. При открытии файла напрямую доступен интерфейс, но серверные комнаты и секретные данные появятся только после подключения backend.</p></section>${sections}${sources}</div>`;showModal(`${m.title}: правила`,'Полный краткий справочник Игрового Хаба',body,{actions:'<button class="btn btn-primary" data-action="close-modal">Понятно</button>'})} // FIX: правила открываются для spy, если игра не выбрана.
    function openVote(){if(!state.roomId)return;const data=state.roomState||{};const room=data.room||{};const me=(data.players||[]).find(p=>String(p.user_id)===String(myId));const allowed=(room.status==='voting'||(room.game_type==='bunker'&&room.status==='discussion'))&&!!me?.is_alive&&!me?.is_spectator&&state.votedRound!==room.current_round;if(!allowed){toast('Сейчас голосовать нельзя.','error');return}if(state.modal?.title==='Голосование')return;const players=(data.players||[]).filter(p=>p.is_alive!==false&&!p.is_spectator&&String(p.user_id)!==String(myId));if(!players.length){toast('Нет доступных кандидатов.','error');return}const body=`<p>Выбери одного игрока. Голос нельзя будет изменить в этом голосовании.</p><div class="vote-list">${players.map(p=>`<button class="vote-option" data-action="select-vote" data-target-id="${esc(p.user_id)}"><span class="vote-radio"></span><span class="player-avatar" style="margin:0;width:38px;height:38px">${playerEmoji(p)}</span><span class="grow"><strong>${esc(userName(p))}</strong><div class="small muted">Участник комнаты</div></span></button>`).join('')}</div>`;showModal('Голосование','Выбери цель',body,{actions:'<button class="btn btn-secondary" data-action="confirm-no">Отмена</button><button class="btn btn-primary" data-action="submit-vote" disabled id="submitVote">Отдать голос</button>'})} // FIX: доступность голоса проверяется по статусу /state, а не несуществующему vote.has_voted.
    async function submitVote(){if(state.selectedVote==null)return toast('Сначала выбери игрока.','error');try{await api(`/rooms/${state.roomId}/vote`,{method:'POST',body:{target_id:state.selectedVote}});state.votedRound=state.room?.current_round;closeModal(true);toast('Голос принят сервером.','success');await refreshRoomState(true)}catch(e){toast(e.message,'error')}} // FIX: повторное голосование в текущем раунде блокируется клиентом.
    function openDiceModal(){const modal=$('#diceModal');modal?.classList.add('open');modal?.setAttribute('aria-hidden','false')} // FIX: кубик — статическая модалка, не удаляемая динамическим modalRoot.
    const DICE_ROTATIONS={1:[0,0],2:[0,-90],3:[0,180],4:[0,90],5:[90,0],6:[-90,0]}; // FIX: вращение под серверный контракт value=1..6.
    async function rollDice(){// FIX: случайное значение передаётся серверу в {value}; результат подтверждается последующим /state.
      if(state.diceRolling||!state.roomId)return;state.diceRolling=true;const cube=$('#diceCube');const btn=$('#rollDiceBtn');const status=$('#diceStatus');if(cube)cube.classList.add('rolling');if(btn)btn.disabled=true;const val=Math.floor(Math.random()*6)+1;window.setTimeout(async()=>{if(cube){cube.classList.remove('rolling');const rot=DICE_ROTATIONS[val];cube.style.transform=`rotateX(${rot[0]-20}deg) rotateY(${rot[1]-20}deg)`}try{await api(`/rooms/${state.roomId}/roll_dice`,{method:'POST',body:{value:val}});if(status)status.textContent=`Выпало ${val}`;toast(`Выпало ${val}`,'success');await refreshRoomState(true)}catch(e){toast(e.message,'error');if(status)status.textContent=e.message;if(btn)btn.disabled=false}finally{state.diceRolling=false;if(btn&&!document.getElementById('diceScoreboard')?.style.display?.includes('flex'))btn.disabled=false}},1000)}

    // ============ ДЕЙСТВИЯ МАНЧКИНА ============
    async function munchkinAction(action,extra={}){if(!state.roomId)return;try{const data=await api(`/rooms/${state.roomId}/munchkin`,{method:'POST',body:{action,...extra}});if(data.room)state.room=data.room;if(data.munchkin_data)state.roomState={...(state.roomState||{}),munchkin_data:data.munchkin_data};toast(data.message||'Действие принято сервером.','success');if(state.view==='market'&&data.state?.room)state.room=data.state.room;await refreshRoomState(true);if(action==='sell'||action==='buy_level')render()}catch(e){toast(e.message,'error')}} // FIX: учитываются только поля, реально существующие в контракте /munchkin и /state.
    async function cardClick(el){const id=el.dataset.cardId;const location=el.dataset.cardLocation;if(id==null||id==='undefined'){toast('У карты отсутствует серверный идентификатор.','error');return}if(location==='equipped'){const ok=await confirmModal('Снять экипировку?',`Снять карту «${el.querySelector('.item-name')?.textContent||'предмет'}»?`,'Снять','Отмена');if(ok)await munchkinAction('unequip',{card_id:id});return}await munchkinAction('play_card',{card_id:id})}

    // Профиль хранит только персональные настройки пользователя; серверные параметры здесь недоступны.
    function saveProfileSettings(form){const f=form||$('form[data-form="profile-settings"]');if(!f)return;const fd=new FormData(f);const name=String(fd.get('displayName')||'').trim().slice(0,40);state.profile=state.profile||{username:'Гость',is_guest:true,balance:0,games_played:0};state.profile.displayName=name;if(name)state.profile.username=state.profile.username||name;safeStorage.set('displayName',name);toast('Имя сохранено.','success');render();}

    // ============ СОБЫТИЯ UI ============
    document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
      if(action==='navigate'){navigate(el.dataset.view);return}
      if(action==='choose-game'){chooseGame(el.dataset.game);return}
      if(action==='scroll-games'){$('#gamesSection')?.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'});return}
      if(action==='refresh-home'){await refreshHome();return}
      if(action==='refresh-rooms'){await loadRooms();return}
      // FIX: обработчик создания комнаты удалён — endpoint POST /rooms отсутствует.
      if(action==='join-room'){await joinRoom(el.dataset.roomId);return}
      if(action==='rules'){showRules(el.dataset.game);return}
      if(action==='back'){if(state.view==='rooms')navigate('home');else if(state.view==='lobby'||state.view==='game'){await leaveRoom()}else if(state.view==='market')navigate('game');return}
      if(action==='start-game'){await startGame();return}
      if(action==='copy-code'){try{await navigator.clipboard.writeText(String(state.room?.code||''));toast('Код комнаты скопирован.','success')}catch{toast(`Код комнаты: ${state.room?.code||state.roomId}`)}return}
      if(action==='leave-room'){await leaveRoom();return}
      if(action==='open-chat'){openChat();return}
      if(action==='game-index'){navigate('home');window.setTimeout(()=>document.querySelector('#gamesSection')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),40);return}
      if(action==='speak-message'){const row=el.closest('.chat-message');speakSystemMessage(row?.dataset.voiceText||'');return}
      if(action==='close-chat'){closeChat();return}
      if(action==='toggle-voice'){await toggleVoice();return}
      if(action==='open-vote'){openVote();return}
      if(action==='select-vote'){state.selectedVote=el.dataset.targetId;$$('.vote-option').forEach(b=>b.classList.toggle('selected',b.dataset.targetId===state.selectedVote));const submit=$('#submitVote');if(submit)submit.disabled=false;return}
      if(action==='submit-vote'){await submitVote();return}
      if(action==='close-modal'){closeModal();return}
      if(action==='backdrop-close'){return}
      if(action==='confirm-no'){closeModal(false);return}
      if(action==='confirm-yes'){closeModal(true);return}
      if(action==='flip-card'){el.classList.toggle('flipped');return}
      if(action==='flip-trait'){el.classList.toggle('flipped');return}
      if(action==='surrender'){const ok=await confirmModal('Сдаться?','Сдача обрабатывается по правилам текущей игры и подтверждается сервером.','Сдаться','Продолжить');if(ok){try{await api(`/rooms/${state.roomId}/surrender`,{method:'POST',body:{}});toast('Сдача обработана сервером.','info');await refreshRoomState(true)}catch(e){toast(e.message,'error')}}return}
      if(action==='open-market'){if(!state.roomId||state.game!=='munchkin'){toast('Рынок доступен в комнате Манчкина.','error');return}state.previousView=state.view;navigate('market');return}
      if(action==='close-market'){navigate(state.roomId?'game':'home');return}
      if(action==='munchkin'){await munchkinAction(el.dataset.munchkinAction,{card_id:el.dataset.cardId});return}
      if(action==='card-click'){await cardClick(el);return}
      if(action==='roll-dice'){await rollDice();return}
      if(action==='refresh-state'){await refreshRoomState(true);return}
      if(action==='refresh-profile'){await loadProfile(false);return}
      if(action==='save-profile-settings'){saveProfileSettings();return}
      if(action==='return-home'){stopPolling();closeChat();state.roomId=null;state.room=null;state.roomState=null;state.game=null;navigate('home');return}
      if(action==='game-menu'){showModal('Меню игры','Дополнительные действия',`<div class="stack"><button class="btn btn-secondary btn-wide" data-action="rules" data-game="${esc(state.game)}">📖 Правила</button><button class="btn btn-secondary btn-wide" data-action="open-chat">💬 Открыть чат</button><button class="btn btn-danger btn-wide" data-action="leave-room">Выйти из комнаты</button></div>`);return}
    });
    document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="flip-card"],[data-action="flip-trait"]')){e.preventDefault();e.target.classList.toggle('flipped')}if(e.key==='Escape'){if(state.chatOpen)closeChat();else if(state.modal)closeModal()}});
    document.addEventListener('submit',async e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(form.dataset.form==='profile-settings'){saveProfileSettings(form);return}if(form.dataset.form==='chat'){const input=$('textarea[name="message"]',form);const text=input?.value||'';if(input)input.value='';await sendMessage(text);if(input)input.focus();return}if(form.dataset.form==='white-guess'){const input=$('input[name="guess"]',form);const guess=input?.value.trim();if(!guess)return;try{await api(`/rooms/${state.roomId}/message`,{method:'POST',body:{text:guess}});toast('Попытка передана серверу.','success');await refreshRoomState(true);form.reset()}catch(err){toast(err.message,'error')}return}});
    document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('textarea[name="message"]')&&!e.shiftKey){e.preventDefault();e.target.closest('form')?.requestSubmit()}});
    document.addEventListener('scroll',()=>{const box=$('#chatMessages');if(box)state.chatPinnedBottom=box.scrollHeight-box.scrollTop-box.clientHeight<75},{passive:true,capture:true});

    // ============ НЕБЛОКИРУЮЩАЯ ЗАГРУЗКА TELEGRAM SDK ============
    // Интерфейс не зависит от CDN: при открытии index.html локально SDK вообще не загружается.
    // На опубликованной странице SDK подгружается асинхронно с коротким пределом ожидания.
    function loadTelegramSdkOptional(){
      if(location.protocol==='file:'||window.Telegram?.WebApp)return Promise.resolve(false);
      return new Promise(resolve=>{
        let settled=false;
        const finish=()=>{if(settled)return;settled=true;resolve(!!window.Telegram?.WebApp)};
        const timer=window.setTimeout(finish,900);
        const script=document.createElement('script');
        script.src='https://telegram.org/js/telegram-web-app.js';
        script.async=true;
        script.onload=()=>{window.clearTimeout(timer);finish()};
        script.onerror=()=>{window.clearTimeout(timer);finish()};
        document.head.appendChild(script);
      });
    }

    // ============ ИНИЦИАЛИЗАЦИЯ TELEGRAM И ГОСТЕВОЙ СЕССИИ ============
    async function initAuth(){// FIX: нет /auth/telegram и /auth/guest; идентичность передаётся заголовками.
      const tg=window.Telegram?.WebApp;try{if(tg){tg.ready();tg.expand();tg.setHeaderColor?.('secondary_bg_color');tg.setBackgroundColor?.('#efe5cf');tg.disableVerticalSwipes?.()}}catch{}
      isGuest=!tg?.initData;
      if(isGuest){guestId=Number(safeStorage.get('guestId'))||0;if(!guestId||guestId>=0){guestId=-(Date.now()%1e9)-Math.floor(Math.random()*1000);safeStorage.set('guestId',String(guestId))}myId=guestId}
      else myId=Number(tg?.initDataUnsafe?.user?.id)||0;
      if(!CONFIG.apiBase){state.profile={username:safeStorage.get('displayName')||'Гость',displayName:safeStorage.get('displayName')||'',is_guest:isGuest,balance:0,games_played:0};setConnectionNotice('');return}
      try{const me=await api('/me');state.profile={...me,displayName:safeStorage.get('displayName')||me.displayName||'',is_guest:isGuest};if(!myId&&!isGuest)myId=Number(me.user_id||me.id)||0;const room=me.current_room;if(room&&typeof room==='object'){state.room=room;state.roomId=room.id||null;state.game=normalizeGame(room.game_type)||state.game}}
      catch(e){state.profile={username:safeStorage.get('displayName')||'Гость',displayName:safeStorage.get('displayName')||'',is_guest:true,balance:0,games_played:0};setConnectionNotice(`Не удалось загрузить /me: ${e.message}`)}
    }
    async function init(){// FIX: localStorage сбои не ломают старт; запросы начинаются после определения myId.
      hydrateDrawnIcons(document);const tg=window.Telegram?.WebApp;if(tg?.initDataUnsafe?.user){const u=tg.initDataUnsafe.user;state.profile={username:[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'Игрок',user_id:u.id,is_guest:false,balance:0,games_played:0}}
      render();await initAuth();state.initialized=true;render();if(CONFIG.apiBase&&CONFIG.supabaseAnonKey){try{state.rooms=await fetchAllRooms();if(state.view==='home')render()}catch{}}if(state.roomId){try{await refreshRoomState(true)}catch{}if(!isFinished())startPolling()}
    }
    window.addEventListener('pagehide',()=>{stopPolling();if(state.recording&&state.recording.state!=='inactive')state.recording.stop();if(state.recordingStream)state.recordingStream.getTracks().forEach(t=>t.stop())});
    window.IgrovoiHub={api,render,loadRooms,refreshRoomState,getState:()=>({view:state.view,game:state.game,roomId:state.roomId,room:state.room,profile:state.profile}),setApiBase(url){CONFIG.apiBase=String(url||'').replace(/\/$/,'');return CONFIG.apiBase}};
    loadTelegramSdkOptional().then(()=>init()).catch(()=>init());
  })();
  </script>
</body>
