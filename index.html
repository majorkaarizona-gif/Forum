<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<title>Игровой хаб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --radius-sm: 8px; 
    --radius-md: 12px; 
    --radius-lg: 16px; 
    --radius-pill: 999px;
    --transition: .2s ease;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #080b14;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1e1b4b 0%, transparent 50%),
               radial-gradient(900px 500px at 100% 0%, #172554 0%, transparent 50%),
               #080b14;
    --surface: rgba(20, 24, 42, .82);
    --surface-solid: #141828;
    --surface-2: #1c2138;
    --surface-3: #252a44;
    --border: rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.14);
    --text: #f1f5f9; --text-muted: #94a3b8;
    --accent: #8b5cf6; --accent-2: #3b82f6;
    --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
    --accent-soft: rgba(139,92,246,.14);
    --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
    --shadow: 0 8px 32px rgba(0,0,0,.5);
    --shadow-sm: 0 2px 10px rgba(0,0,0,.25);
    --chat-me: linear-gradient(135deg, #8b5cf6, #3b82f6);
    --chat-other: #252a44;
  }
  [data-theme="light"] {
    --bg: #eef2f8;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 50%),
               radial-gradient(900px 500px at 100% 0%, #dbeafe 0%, transparent 50%),
               #eef2f8;
    --surface: rgba(255,255,255,.85);
    --surface-solid: #ffffff;
    --surface-2: #f6f8fc;
    --surface-3: #e8edf5;
    --border: rgba(15,23,42,.08);
    --border-strong: rgba(15,23,42,.16);
    --text: #0f172a; --text-muted: #64748b;
    --accent: #7c3aed; --accent-2: #2563eb;
    --accent-grad: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
    --accent-soft: rgba(124,58,237,.1);
    --success: #16a34a; --danger: #dc2626; --warning: #d97706;
    --shadow: 0 8px 32px rgba(15,23,42,.08);
    --shadow-sm: 0 2px 10px rgba(15,23,42,.05);
    --chat-me: linear-gradient(135deg, #7c3aed, #2563eb);
    --chat-other: #f6f8fc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100dvh; overflow: hidden;
    font-family: var(--font); background: var(--bg-grad); background-attachment: fixed;
    color: var(--text); -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; display: flex; align-items: center; justify-content: center; }
  input, textarea { font-family: inherit; }
  svg { display: block; flex-shrink: 0; }

  /* Layout Core */
  .app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .main { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    background: var(--surface); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
  .brand-logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-grad); display: grid; place-items: center; color: #fff; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .balance-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--accent-soft); border-radius: var(--radius-pill); font-weight: 700; font-size: 13px; color: var(--accent); }
  
  /* Screens Container - Crucial for fixing overlaps */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  
  .screen { 
    display: none; 
    flex: 1; 
    overflow-y: auto; 
    padding: 16px; 
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: flex; flex-direction: column; }
  .screen.with-chat { padding: 0; overflow: hidden; }
  .screen.with-chat .scroll-area { flex: 1; overflow-y: auto; padding: 16px; }
  
  /* Bottom Nav */
  .bottom-nav {
    display: flex; background: var(--surface); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    flex-shrink: 0; z-index: 10;
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 10px; font-weight: 600; }
  .nav-item.active { color: var(--accent); background: var(--accent-soft); }

  /* UI Elements */
  .page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .page-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
  
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; border-radius: var(--radius-md);
    font-weight: 700; font-size: 14px; transition: all var(--transition);
    border: 1px solid transparent; width: 100%; margin-bottom: 8px;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent-grad); color: #fff; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  
  /* Game Cards */
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .game-card { border-radius: var(--radius-lg); padding: 16px; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; cursor: pointer; }
  .game-card.spy { background: linear-gradient(135deg, #6366f1, #a855f7); }
  .game-card.crocodile { background: linear-gradient(135deg, #10b981, #06b6d4); }
  .game-card h3 { font-size: 16px; font-weight: 800; margin-top: 8px; }
  .game-card p { font-size: 11px; opacity: .85; }

  /* Room List */
  .room-item { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 8px; cursor: pointer; }
  .room-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
  .room-info { flex: 1; }
  .room-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .room-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-dot.waiting { background: var(--success); }
  .status-dot.playing { background: var(--danger); }

  /* Chat & Game UI */
  .chat-wrap { display: flex; flex-direction: column; background: var(--bg); width: 100%; border-top: 1px solid var(--border); flex-shrink: 0; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 14px; }
  .msg-me { align-self: flex-end; background: var(--chat-me); color: #fff; border-bottom-right-radius: 4px; }
  .msg-other { align-self: flex-start; background: var(--chat-other); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  .msg-system { align-self: center; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 12px; text-align: center; }
  .msg-meta { font-size: 11px; opacity: .7; font-weight: 700; margin-bottom: 2px; }
  
  .chat-input-bar { display: flex; gap: 8px; padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
  .chat-input-bar input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; outline: none; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); }
  .icon-btn.send { background: var(--accent-grad); color: #fff; border: none; }

  /* Player List */
  .player-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface-2); border-radius: var(--radius-md); margin-bottom: 6px; }
  .player-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-grad); color: #fff; font-weight: 700; font-size: 12px; }
  .player-name { flex: 1; font-weight: 600; font-size: 14px; }

  /* Game Cards inside Game */
  .state-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
  .state-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .state-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .secret-word { padding: 16px; margin-top: 12px; border-radius: var(--radius-md); background: var(--accent-soft); border: 1px dashed var(--accent); font-size: 22px; font-weight: 800; color: var(--accent); text-align: center; }
  .vote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

  /* Toast */
  .toast-wrap { position: fixed; top: calc(env(safe-area-inset-top) + 60px); left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: calc(100% - 32px); max-width: 380px; }
  .toast { padding: 10px 14px; background: var(--surface-solid); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; animation: slideDown .3s ease; }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px; }

  /* Desktop adjustments */
  @media (min-width: 768px) {
    .app { flex-direction: row; justify-content: center; background: #000; }
    .main { width: 100%; max-width: 600px; background: var(--bg-grad); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .bottom-nav { display: none; } /* Hide bottom nav on PC for simplicity, or keep it */
    .header { padding: 16px 20px; }
    .screen { padding: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <header class="header">
      <div class="brand">
        <div class="brand-logo" id="headerBrandIcon"></div>
        <span id="headerTitle">Игровой хаб</span>
      </div>
      <div class="header-actions">
        <div class="balance-pill">
          <span id="balanceIcon"></span>
          <span id="balanceValue">0</span>
        </div>
        <button class="icon-btn" id="themeBtn" title="Сменить тему"></button>
      </div>
    </header>

    <main class="content" id="content">
      <!-- HOME -->
      <section class="screen active" id="screen-home">
        <h1 class="page-title">Привет, <span id="userName">Игрок</span></h1>
        <p class="page-subtitle">Выбирай игру и присоединяйся</p>
        <div class="game-grid" id="gameGrid"></div>
        
        <h2 style="font-size:16px; margin-bottom:12px; font-weight:700;">Активные комнаты</h2>
        <div id="activeRooms"></div>
      </section>

      <!-- ROOMS -->
      <section class="screen" id="screen-rooms">
        <button class="btn btn-secondary" id="backBtn" style="width:auto; align-self:flex-start; padding:8px 12px; margin-bottom:16px;"></button>
        <h1 class="page-title" id="roomsTitle">Комнаты</h1>
        <p class="page-subtitle">Выбери свободную комнату</p>
        <div id="roomList"></div>
      </section>

      <!-- LOBBY -->
      <section class="screen with-chat" id="screen-lobby">
        <div class="scroll-area" id="lobbyScroll">
          <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
            <button class="btn btn-secondary" id="leaveLobbyBtn" style="width:auto; margin:0; padding:8px 12px;"></button>
            <span style="font-size:12px; align-self:center; color:var(--text-muted);" id="lobbyStatus"></span>
          </div>
          <h1 class="page-title" id="lobbyTitle">Лобби</h1>
          <p class="page-subtitle" id="lobbySubtitle">Ожидание игроков</p>

          <div class="state-card">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
              <span id="playersIcon" style="color:var(--accent);"></span>
              <span style="font-weight:700; font-size:14px;">Игроки (<span id="playersCount">0</span>/20)</span>
            </div>
            <div id="lobbyPlayers"></div>
          </div>
          <button class="btn btn-primary" id="startBtn">Начать игру</button>
        </div>
        
        <div class="chat-wrap" style="flex: 1;">
          <div class="chat-messages" id="lobbyChat"></div>
          <div class="chat-input-bar">
            <button class="icon-btn" id="lobbyVoiceBtn" title="Голосовое сообщение"></button>
            <input type="text" id="lobbyInput" placeholder="Сообщение..." autocomplete="off" />
            <button class="icon-btn send" id="lobbySendBtn"></button>
          </div>
        </div>
      </section>

      <!-- GAME -->
      <section class="screen with-chat" id="screen-game">
        <div class="scroll-area" id="gameScroll">
          <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
            <button class="btn btn-secondary" id="leaveGameBtn" style="width:auto; margin:0; padding:8px 12px;"></button>
            <span style="font-size:12px; align-self:center; color:var(--text-muted);" id="gameStatus"></span>
          </div>
          <div id="gameContent"></div>
        </div>

        <div class="chat-wrap" style="flex: 1;">
          <div class="chat-messages" id="gameChat"></div>
          <div class="chat-input-bar" id="gameInputBar">
            <button class="icon-btn" id="gameVoiceBtn" title="Голосовое сообщение"></button>
            <input type="text" id="gameInput" placeholder="Сообщение..." autocomplete="off" />
            <button class="icon-btn send" id="gameSendBtn"></button>
          </div>
        </div>
      </section>

      <!-- PROFILE -->
      <section class="screen" id="screen-profile">
        <h1 class="page-title">Профиль</h1>
        <p class="page-subtitle">Твоя статистика</p>
        <div class="state-card">
          <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px;">
            <div class="player-avatar" id="profileAvatar" style="width:56px; height:56px; font-size:22px;">U</div>
            <div>
              <div style="font-weight:800; font-size:18px;" id="profileName">Игрок</div>
              <div style="color:var(--text-muted); font-size:13px;" id="profileId">ID: —</div>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div style="padding:14px; background:var(--surface-2); border-radius:var(--radius-md);">
              <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Баланс</div>
              <div style="font-weight:800; font-size:20px; color:var(--accent);" id="profileBalance">0</div>
            </div>
            <div style="padding:14px; background:var(--surface-2); border-radius:var(--radius-md);">
              <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Игр сыграно</div>
              <div style="font-weight:800; font-size:20px;" id="profileGames">0</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   SVG ICONS
   ============================================================ */
const ICON_PATHS = {
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  croc: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M8 14v2M12 16v-2M16 14v2"/><circle cx="9" cy="9" r=".5" fill="currentColor"/><circle cx="15" cy="9" r=".5" fill="currentColor"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a2 2 0 0 1 0 4h-3a2 2 0 0 0 0 4h4"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  arrowLeft: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  crown: '<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  skull: '<circle cx="12" cy="9" r="7"/><path d="M9 16v3a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/>',
  ghost: '<path d="M9 10h.01M15 10h.01M12 2a8 8 0 0 0-8 8v12l3-3 3 3 2-2 2 2 3-3 3 3V10a8 8 0 0 0-8-8z"/>',
  zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>'
};
function icon(name, size = 20) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ''}</svg>`;
}

/* ============================================================
   CONFIG & INIT
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: 'https://jgjereoejdipaqwjhexc.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_rAKslUXIvq-SjFbBGJV6DQ_3IZSJZPL',
  FUNCTIONS_URL: 'https://jgjereoejdipaqwjhexc.supabase.co/functions/v1',
};

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.disableVerticalSwipes?.(); }
const telegramUser = tg?.initDataUnsafe?.user || { id: 123456789, first_name: 'Гость', username: 'guest' };
const myId = telegramUser.id;

/* ============================================================
   THEME (Только одна кнопка в хедере)
   ============================================================ */
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  document.getElementById('themeBtn').innerHTML = icon(theme === 'dark' ? 'sun' : 'moon', 18);
  if (tg) {
    tg.setHeaderColor(theme === 'dark' ? '#080b14' : '#eef2f8');
    tg.setBackgroundColor(theme === 'dark' ? '#080b14' : '#eef2f8');
  }
}
function initTheme() {
  const saved = localStorage.getItem('theme');
  setTheme(saved || (tg?.colorScheme === 'light' ? 'light' : 'dark'));
}
document.getElementById('themeBtn').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ============================================================
   API
   ============================================================ */
async function api(path, method = 'GET', body = null) {
  try {
    const res = await fetch(`${CONFIG.FUNCTIONS_URL}${path}`, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'apikey': CONFIG.SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
        'x-telegram-init-data': tg?.initData || '',
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error(await res.text() || `HTTP ${res.status}`);
    return await res.json();
  } catch (e) { console.error("API Error:", e); throw e; }
}

/* ============================================================
   STATE & NAVIGATION
   ============================================================ */
const state = { balance: 0, currentRoom: null, lastMessageId: 0, pollingTimer: null, userIsHost: false, currentGame: null };
const screens = {
  home: document.getElementById('screen-home'),
  rooms: document.getElementById('screen-rooms'),
  lobby: document.getElementById('screen-lobby'),
  game: document.getElementById('screen-game'),
  profile: document.getElementById('screen-profile'),
};

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name]?.classList.add('active');
}

const NAV_ITEMS = [
  { id: 'home', icon: 'home', label: 'Главная' },
  { id: 'shpion', icon: 'eye', label: 'Шпион' },
  { id: 'crocodile', icon: 'croc', label: 'Крокодил' },
  { id: 'profile', icon: 'user', label: 'Профиль' },
];

function renderNav() {
  document.getElementById('bottomNav').innerHTML = NAV_ITEMS.map(n => 
    `<button class="nav-item" data-nav="${n.id}">${icon(n.icon, 20)}<span>${n.label}</span></button>`
  ).join('');
  document.querySelectorAll('.nav-item[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const nav = el.dataset.nav;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      if (nav === 'home') goHome();
      if (nav === 'profile') goProfile();
      if (nav === 'shpion') goRooms('shpion');
      if (nav === 'crocodile') goRooms('crocodile');
    });
  });
}

/* ============================================================
   SCREENS: HOME & ROOMS
   ============================================================ */
async function goHome() {
  stopPolling(); showScreen('home');
  document.getElementById('headerTitle').textContent = 'Игровой хаб';
  document.getElementById('userName').textContent = telegramUser.first_name;
  
  document.getElementById('gameGrid').innerHTML = `
    <div class="game-card spy" onclick="goRooms('shpion')">
      <div>${icon('eye', 28)}</div>
      <div><h3>Шпион</h3><p>Найди шпиона</p></div>
    </div>
    <div class="game-card crocodile" onclick="goRooms('crocodile')">
      <div>${icon('croc', 28)}</div>
      <div><h3>Крокодил</h3><p>Угадай слово</p></div>
    </div>
  `;

  await Promise.all([refreshBalance(), loadActiveRooms()]);
}

async function refreshBalance() {
  try {
    const data = await api('/api/me');
    state.balance = data.balance ?? 0;
    document.getElementById('balanceValue').textContent = state.balance;
    document.getElementById('profileBalance').textContent = state.balance;
    document.getElementById('profileGames').textContent = data.games_played ?? 0;
    
    // Если игрок уже в комнате (например, зашел с телефона, пока играл в боте)
    if (data.current_room && !state.currentRoom) {
      state.currentRoom = data.current_room;
      if (data.current_room.status === 'waiting') goLobby(); else goGame();
    }
  } catch (e) { console.error(e); }
}

async function loadActiveRooms() {
  const container = document.getElementById('activeRooms');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const rooms = await api('/api/rooms');
    const active = (rooms || []).filter(r => r.status !== 'finished').slice(0, 4);
    if (!active.length) { container.innerHTML = `<div class="empty-state">Пока нет активных комнат</div>`; return; }
    
    container.innerHTML = active.map(r => `
      <div class="room-item" onclick="joinRoom(${r.id})">
        <div class="room-icon">${icon(r.game_type === 'shpion' ? 'eye' : 'croc', 20)}</div>
        <div class="room-info">
          <div class="room-name">${esc(r.code)}</div>
          <div class="room-meta"><span class="status-dot ${r.status !== 'waiting' ? 'playing' : 'waiting'}"></span>${r.status !== 'waiting' ? 'Играют' : `${r.players_count}/20`}</div>
        </div>
        ${icon('arrowLeft', 16)}
      </div>
    `).join('');
  } catch (e) { container.innerHTML = `<div class="empty-state">Ошибка загрузки</div>`; }
}

async function goRooms(game) {
  state.currentGame = game;
  showScreen('rooms');
  document.getElementById('headerTitle').textContent = game === 'shpion' ? 'Шпион' : 'Крокодил';
  document.getElementById('roomsTitle').textContent = game === 'shpion' ? 'Шпион' : 'Крокодил';
  document.getElementById('backBtn').innerHTML = icon('arrowLeft', 16) + ' Назад';
  document.getElementById('backBtn').onclick = goHome;

  const container = document.getElementById('roomList');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const rooms = await api(`/api/rooms?game=${game}`);
    container.innerHTML = rooms.map(r => `
      <div class="room-item" ${r.status === 'waiting' ? `onclick="joinRoom(${r.id})"` : ''}>
        <div class="room-icon">${icon(r.status === 'waiting' ? 'door' : 'x', 20)}</div>
        <div class="room-info">
          <div class="room-name">${esc(r.code)}</div>
          <div class="room-meta"><span class="status-dot ${r.status !== 'waiting' ? 'playing' : 'waiting'}"></span>${r.status !== 'waiting' ? 'Игра уже идет' : `${r.players_count}/20`}</div>
        </div>
      </div>
    `).join('');
  } catch (e) { container.innerHTML = `<div class="empty-state">Ошибка загрузки</div>`; }
}

async function joinRoom(roomId) {
  try {
    const room = await api(`/api/rooms/${roomId}/join`, 'POST');
    state.currentRoom = room; state.lastMessageId = 0;
    showToast('Вы вошли в комнату', 'success');
    if (room.status === 'waiting') goLobby(); else goGame();
  } catch (e) { showToast('Не удалось войти', 'error'); }
}

/* ============================================================
   SCREENS: LOBBY
   ============================================================ */
async function goLobby() {
  showScreen('lobby');
  document.getElementById('headerTitle').textContent = state.currentRoom.code;
  document.getElementById('lobbyTitle').textContent = state.currentRoom.code;
  document.getElementById('leaveLobbyBtn').innerHTML = icon('arrowLeft', 16) + ' Выйти';
  document.getElementById('leaveLobbyBtn').onclick = leaveRoom;
  document.getElementById('playersIcon').innerHTML = icon('users', 16);
  document.getElementById('lobbySendBtn').innerHTML = icon('send', 16);
  document.getElementById('lobbyVoiceBtn').innerHTML = icon('mic', 16);
  document.getElementById('lobbyVoiceBtn').onclick = () => showToast('Запись ГС скоро появится!', 'info');
  
  await refreshLobby();
  startPolling(refreshLobby, 2000);
}

async function refreshLobby() {
  if (!state.currentRoom) return;
  try {
    const data = await api(`/api/rooms/${state.currentRoom.id}/state?since_id=${state.lastMessageId}`);
    state.currentRoom = data.room; state.userIsHost = data.room.host_id === myId;
    
    if (data.room.status !== 'waiting') return goGame();

    document.getElementById('playersCount').textContent = data.players.length;
    document.getElementById('lobbyStatus').textContent = data.room.game_type === 'shpion' ? 'Шпион' : 'Крокодил';
    
    document.getElementById('lobbyPlayers').innerHTML = data.players.map(p => `
      <div class="player-item">
        <div class="player-avatar">${esc((p.username || 'И')[0].toUpperCase())}</div>
        <div class="player-name">${esc(p.username || 'Игрок')} ${p.user_id === myId ? '(вы)' : ''}</div>
        ${data.room.host_id === p.user_id ? icon('crown', 16) : ''}
      </div>
    `).join('');

    const startBtn = document.getElementById('startBtn');
    const minPlayers = data.room.game_type === 'crocodile' ? 2 : 3;
    const canStart = data.players.length >= minPlayers;
    
    startBtn.style.display = (state.userIsHost || data.room.host_id === -1) ? 'flex' : 'none';
    startBtn.disabled = !canStart;
    startBtn.innerHTML = icon('play', 16) + (canStart ? ' Начать игру' : ` Нужно ещё ${minPlayers - data.players.length}`);

    appendMessages(data.messages || [], 'lobbyChat');
  } catch (e) { console.error(e); }
}

document.getElementById('startBtn').onclick = async () => {
  try { await api(`/api/rooms/${state.currentRoom.id}/start`, 'POST'); }
  catch (e) { showToast('Ошибка старта', 'error'); }
};

document.getElementById('leaveLobbyBtn').onclick = leaveRoom;
async function leaveRoom() {
  if (!state.currentRoom) return;
  try { await api(`/api/rooms/${state.currentRoom.id}/leave`, 'POST'); } catch {}
  state.currentRoom = null; stopPolling(); goHome();
}

/* ============================================================
   SCREENS: GAME
   ============================================================ */
async function goGame() {
  showScreen('game');
  document.getElementById('headerTitle').textContent = state.currentRoom.code;
  document.getElementById('leaveGameBtn').innerHTML = icon('arrowLeft', 16) + ' Выйти';
  document.getElementById('leaveGameBtn').onclick = leaveRoom;
  document.getElementById('gameSendBtn').innerHTML = icon('send', 16);
  document.getElementById('gameVoiceBtn').innerHTML = icon('mic', 16);
  document.getElementById('gameVoiceBtn').onclick = () => showToast('Запись ГС скоро появится!', 'info');
  
  await refreshGame();
  startPolling(refreshGame, 1500);
}

async function refreshGame() {
  if (!state.currentRoom) return;
  try {
    const data = await api(`/api/rooms/${state.currentRoom.id}/state?since_id=${state.lastMessageId}`);
    state.currentRoom = data.room;
    const me = data.players.find(p => p.user_id === myId);

    if (data.room.status === 'waiting') { goLobby(); return; }

    document.getElementById('gameStatus').textContent = data.room.game_type === 'shpion' ? 'Шпион' : 'Крокодил';
    renderGameContent(data.room, data.players, me);
    appendMessages(data.messages || [], 'gameChat');
    updateGameInput(data.room, me);
  } catch (e) { console.error(e); }
}

function renderGameContent(room, players, me) {
  const el = document.getElementById('gameContent');
  
  if (room.status === 'countdown') {
    el.innerHTML = `<div class="state-card" style="text-align:center;">${icon('clock', 32)}<div class="state-title">Игра начинается...</div></div>`;
    return;
  }

  if (room.status === 'finished') {
    el.innerHTML = `
      <div class="state-card" style="text-align:center;">
        ${icon('trophy', 32)}
        <div class="state-title">Игра окончена</div>
        <div class="state-subtitle">${room.game_type === 'shpion' ? 'Слово: ' + room.pending_guess : ''}</div>
      </div>
      <button class="btn btn-primary" onclick="playAgain()">${icon('refresh', 16)} Играть снова</button>
    `;
    return;
  }

  if (room.status === 'guessing') {
    el.innerHTML = `<div class="state-card"><div class="state-label">Последний шанс</div><div class="state-title">${room.guesser_id === myId ? 'Вы Мистер Уайт' : 'Мистер Уайт угадывает'}</div><div class="state-desc">${room.guesser_id === myId ? 'Напишите догадку в чат!' : 'Ждем ответа...'}</div></div>`;
    return;
  }

  if (room.game_type === 'crocodile' && room.status === 'playing') {
    const isHost = room.current_speaker_id === myId;
    el.innerHTML = `
      <div class="state-card">
        <div class="state-label">${isHost ? 'Ты ведущий' : 'Ведущий'}</div>
        <div class="state-title">${isHost ? 'Объясни слово' : (players.find(p => p.user_id === room.current_speaker_id)?.username || '...') + ' объясняет'}</div>
        ${isHost ? `<div class="secret-word">${esc(room.pending_guess || '...')}</div>` : ''}
      </div>
    `;
    return;
  }

  if (room.game_type === 'shpion' && room.status === 'playing') {
    const isMyTurn = room.current_speaker_id === myId;
    const speaker = players.find(p => p.user_id === room.current_speaker_id);
    const myRole = me?.role;
    const myWord = me?.word;
    const roleLabel = myRole === 'civilian' ? 'Мирный' : myRole === 'undercover' ? 'Шпион' : 'Мистер Уайт';
    const roleIcon = myRole === 'civilian' ? 'user' : myRole === 'undercover' ? 'eye' : 'ghost';

    el.innerHTML = `
      <div class="state-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <div class="state-label">Раунд ${room.current_round}</div>
          <div style="font-size:12px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:4px;">${icon(roleIcon, 14)} ${roleLabel}</div>
        </div>
        ${myWord ? `<div class="secret-word">${esc(myWord)}</div>` : `<div style="text-align:center; color:var(--text-muted); font-style:italic; margin-top:10px;">Нет слова — блефуй!</div>`}
      </div>
      <div class="state-card">
        <div class="state-label">${isMyTurn ? 'Твоя очередь' : 'Сейчас говорит'}</div>
        <div class="state-title">${isMyTurn ? 'Опиши слово' : esc(speaker?.username || '...')}</div>
        ${isMyTurn && (myRole === 'undercover' || myRole === 'mrwhite') ? `<button class="btn btn-secondary" onclick="guessWord()" style="margin-top:12px;">${icon('zap', 16)} Угадать слово</button>` : ''}
      </div>
    `;
    return;
  }

  if (room.game_type === 'shpion' && room.status === 'discussion') {
    const alive = players.filter(p => p.is_alive && !p.is_spectator);
    el.innerHTML = `
      <div class="state-card">
        <div class="state-label">Обсуждение</div>
        <div class="state-title">Кто шпион?</div>
      </div>
      <div class="state-card">
        <div class="state-label" style="margin-bottom:10px;">Голосование</div>
        <div class="vote-grid">
          ${alive.filter(p => p.user_id !== myId).map(p => `
            <button class="btn btn-secondary" onclick="vote(${p.user_id}, this)">
              ${icon('user', 16)} ${esc(p.username || 'Игрок')}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }
}

function updateGameInput(room, me) {
  const bar = document.getElementById('gameInputBar');
  if (room.status === 'finished' || room.status === 'countdown' || (!me?.is_alive && room.status !== 'finished')) {
    bar.style.display = 'none';
  } else {
    bar.style.display = 'flex';
  }
}

/* ============================================================
   CHAT & ACTIONS
   ============================================================ */
function appendMessages(messages, targetId) {
  if (!messages || !messages.length) return;
  const container = document.getElementById(targetId);
  const maxId = Math.max(...messages.map(m => m.id));
  if (maxId > state.lastMessageId) state.lastMessageId = maxId;

  messages.forEach(m => {
    if (document.querySelector(`[data-msg-id="${m.id}"]`)) return; 
    const el = document.createElement('div');
    el.dataset.msgId = m.id;
    if (m.is_system) {
      el.className = 'msg msg-system'; el.textContent = m.text;
    } else {
      const isMe = m.user_id === myId;
      el.className = `msg ${isMe ? 'msg-me' : 'msg-other'}`;
      el.innerHTML = `${!isMe ? `<div class="msg-meta">${esc(m.username)}</div>` : ''}${esc(m.text)}`;
    }
    container.appendChild(el);
  });
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage(inputId) {
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if (!text || !state.currentRoom) return;
  input.value = ''; input.disabled = true;
  try { await api(`/api/rooms/${state.currentRoom.id}/message`, 'POST', { text }); }
  catch (e) { showToast('Ошибка отправки', 'error'); input.value = text; }
  finally { input.disabled = false; input.focus(); }
}

document.getElementById('lobbySendBtn').onclick = () => sendChatMessage('lobbyInput');
document.getElementById('lobbyInput').onkeydown = (e) => { if (e.key === 'Enter') sendChatMessage('lobbyInput'); };
document.getElementById('gameSendBtn').onclick = () => sendChatMessage('gameInput');
document.getElementById('gameInput').onkeydown = (e) => { if (e.key === 'Enter') sendChatMessage('gameInput'); };

async function vote(targetId, btn) {
  try {
    await api(`/api/rooms/${state.currentRoom.id}/vote`, 'POST', { target_id: targetId });
    showToast('Голос учтён', 'success'); btn.disabled = true;
  } catch (e) { showToast('Ошибка', 'error'); }
}

async function guessWord() {
  const word = prompt('Твоя догадка:');
  if (word) {
    try { await api(`/api/rooms/${state.currentRoom.id}/guess`, 'POST', { text: word }); } catch (e) { showToast('Ошибка', 'error'); }
  }
}

async function playAgain() {
  try { await api(`/api/rooms/${state.currentRoom.id}/play_again`, 'POST'); showToast('Готовы!', 'success'); } catch (e) { showToast('Ошибка', 'error'); }
}

/* ============================================================
   PROFILE & UTILS
   ============================================================ */
async function goProfile() {
  stopPolling(); showScreen('profile');
  document.getElementById('headerTitle').textContent = 'Профиль';
  document.getElementById('profileName').textContent = telegramUser.first_name;
  document.getElementById('profileId').textContent = 'ID: ' + myId;
  document.getElementById('profileAvatar').textContent = (telegramUser.first_name || 'U')[0].toUpperCase();
  await refreshBalance();
}

function startPolling(fn, ms) { stopPolling(); state.pollingTimer = setInterval(fn, ms); }
function stopPolling() { if (state.pollingTimer) clearInterval(state.pollingTimer); }
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function showToast(text, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `${icon(type === 'success' ? 'check' : 'x', 16)} <span>${esc(text)}</span>`;
  wrap.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('headerBrandIcon').innerHTML = icon('zap', 18);
document.getElementById('balanceIcon').innerHTML = icon('coin', 14);
initTheme();
renderNav();
goHome();
</script>
</body>
</html>
