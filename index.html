<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounty Market</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html {
        height: 100%;
        background-color: #050505;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
    }

    /* КОНТЕЙНЕР ПРИЛОЖЕНИЯ */
    #app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
    }

    /* ВЕРХНЯЯ ПАНЕЛЬ */
    .top-bar {
        height: 50px;
        background: #0A0A0A;
        border-bottom: 1px solid rgba(229, 9, 20, 0.3);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        z-index: 10;
        box-shadow: 0 2px 15px rgba(229, 9, 20, 0.1);
    }
    
    .brand {
        font-family: 'Oswald', sans-serif;
        color: #E50914;
        text-transform: uppercase;
        font-size: 18px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* ПК-МЕНЮ (Сверху) */
    .pc-nav {
        display: none; /* Скрыто на телефоне */
        gap: 20px;
    }
    .pc-nav a {
        color: #9A9A9A;
        text-decoration: none;
        font-family: 'Oswald', sans-serif;
        font-size: 14px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: 0.3s;
    }
    .pc-nav a svg {
        width: 18px; height: 18px;
        fill: none; stroke: currentColor; stroke-width: 2;
    }
    .pc-nav a:hover, .pc-nav a.active {
        color: #E50914;
    }
    .pc-nav a:hover svg, .pc-nav a.active svg {
        stroke: #E50914;
        filter: drop-shadow(0 0 5px rgba(229,9,20,0.8));
    }

    /* САМ САЙТ (IFRAME) */
    .iframe-wrapper {
        flex: 1;
        position: relative;
        background: #000;
        overflow: hidden;
    }
    
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        /* МАГИЯ: Крутим бирюзовый в красный и делаем его темнее */
        filter: hue-rotate(160deg) saturate(1.8) contrast(1.2) brightness(0.85);
    }

    /* НИЖНЕЕ МЕНЮ (ДЛЯ ТЕЛЕФОНА) */
    .bottom-nav {
        height: 65px;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(229, 9, 20, 0.3);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 10;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #9A9A9A;
        text-decoration: none;
        font-size: 11px;
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
        transition: 0.3s;
        width: 16%;
    }
    
    .nav-item svg {
        width: 22px;
        height: 22px;
        margin-bottom: 4px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: 0.3s;
    }

    .nav-item:hover, .nav-item:active, .nav-item.active {
        color: #E50914;
    }
    .nav-item:hover svg, .nav-item:active svg, .nav-item.active svg {
        stroke: #E50914;
        filter: drop-shadow(0 0 6px rgba(229, 9, 20, 0.8));
        transform: translateY(-2px);
    }

    /* АДАПТИВ ПОД ПК */
    @media (min-width: 800px) {
        .bottom-nav { display: none; } /* Прячем нижнее меню на ПК */
        .top-bar { height: 60px; padding: 0 30px; }
        .pc-nav { display: flex; } /* Показываем верхнее меню на ПК */
        .brand { font-size: 24px; }
    }
</style>
</head>
<body>

<div id="app-container">
    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="top-bar">
        <div class="brand">
            <!-- Иконка огня для логотипа -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E50914" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
            Bounty Market
        </div>
        
        <!-- Меню для ПК -->
        <nav class="pc-nav" id="pcNav">
            <a href="https://va-ta.com/app/#overview" target="siteFrame" class="active" data-target="overview">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Обзор
            </a>
            <a href="https://va-ta.com/app/#shops" target="siteFrame" data-target="shops">
                <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                Лавки
            </a>
            <a href="https://va-ta.com/app/#prices" target="siteFrame" data-target="prices">
                <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                Цены
            </a>
            <a href="https://va-ta.com/app/#listings" target="siteFrame" data-target="listings">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                Объяв.
            </a>
            <a href="https://va-ta.com/app/#rating" target="siteFrame" data-target="rating">
                <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                Рейтинг
            </a>
            <a href="https://va-ta.com/app/#profile" target="siteFrame" data-target="profile">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Профиль
            </a>
        </nav>
    </header>

    <!-- САМ САЙТ -->
    <div class="iframe-wrapper">
        <iframe name="siteFrame" id="siteFrame" src="https://va-ta.com/app/#overview" allow="clipboard-write; clipboard-read"></iframe>
    </div>

    <!-- НИЖНЕЕ МЕНЮ (ДЛЯ ТЕЛЕФОНА) -->
    <nav class="bottom-nav" id="mobileNav">
        <a href="https://va-ta.com/app/#overview" target="siteFrame" class="nav-item active" data-target="overview">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Обзор
        </a>
        <a href="https://va-ta.com/app/#shops" target="siteFrame" class="nav-item" data-target="shops">
            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            Лавки
        </a>
        <a href="https://va-ta.com/app/#prices" target="siteFrame" class="nav-item" data-target="prices">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Цены
        </a>
        <a href="https://va-ta.com/app/#listings" target="siteFrame" class="nav-item" data-target="listings">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            Объяв.
        </a>
        <a href="https://va-ta.com/app/#rating" target="siteFrame" class="nav-item" data-target="rating">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
            Рейтинг
        </a>
        <a href="https://va-ta.com/app/#profile" target="siteFrame" class="nav-item" data-target="profile">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Профиль
        </a>
    </nav>
</div>

<script>
    // Скрипт для подсветки активной вкладки в нашем меню
    const navLinks = document.querySelectorAll('.pc-nav a, .bottom-nav a');

    navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            // Убираем активный класс у всех ссылок
            navLinks.forEach(l => l.classList.remove('active'));
            
            // Добавляем класс active для текущей и для её "двойника" (ПК/моб)
            const target = this.getAttribute('data-target');
            document.querySelectorAll(`a[data-target="${target}"]`).forEach(el => {
                el.classList.add('active');
            });
        });
    });
</script>
</body>
</html>
