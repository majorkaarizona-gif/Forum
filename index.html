<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Store Logo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000; /* Черный фон */
        }

        /* Стили для самого логотипа */
        .logo {
            width: 600px; /* Размер логотипа */
            max-width: 90vw;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- Вставляем скачанный SVG файл через тег img -->
    <img src="logo.svg" alt="Black Store Logo" class="logo">

</body>
</html>
