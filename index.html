<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wait Russia — Официальный форум</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d0f; color: #e1e1e6; font-family: system-ui, -apple-system, sans-serif; }
        .br-card { background-color: #17171c; border: 1px solid #272730; }
        .br-input { background-color: #0f0f13; border: 1px solid #2a2a35; color: #fff; }
        .br-input:focus { border-color: #dc2626; outline: none; }
        .br-red-btn { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); }
        .br-red-btn:hover { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ШАПКА В СТИЛЕ BLACK RUSSIA -->
    <header class="br-card border-b border-zinc-800 py-3 px-6 shadow-lg">
        <div class="container mx-auto flex justify-between items-center max-w-6xl">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showHome()">
                <div class="bg-red-600 text-white font-black px-3 py-1.5 rounded-lg text-lg tracking-wider shadow-md shadow-red-900/40">WAIT</div>
                <div>
                    <div class="text-lg font-black tracking-wider leading-none text-white">RUSSIA <span class="text-red-500 text-xs">RP</span></div>
                    <div class="text-[10px] text-zinc-400 tracking-widest uppercase">Mobile Online</div>
                </div>
            </div>
            <div id="user-menu" class="flex items-center space-x-3">
                <!-- Заполняется скриптом -->
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-6xl">
        
        <!-- Навигация (Хлебные крошки) -->
        <div class="flex justify-between items-center mb-6 bg-zinc-900/50 p-3 rounded-xl border border-zinc-800/60">
            <div id="breadcrumbs" class="text-xs text-zinc-400">
                <span class="cursor-pointer text-red-500 hover:underline font-semibold" onclick="showHome()">Главная</span>
            </div>
            <div id="action-btn-container"></div>
        </div>

        <!-- ДИНАМИЧЕСКИЕ СТРАНИЦЫ -->
        <div id="app-content"></div>

    </main>

    <!-- ФУТЕР -->
    <footer class="br-card border-t border-zinc-800 py-6 text-center text-xs text-zinc-500 mt-auto">
        <div class="container mx-auto max-w-6xl space-y-1">
            <p class="font-bold text-zinc-400">Wait Russia RolePlay • Обязательный игровой форум</p>
            <p>Все права защищены © 2026. Offline Prototype Mode.</p>
        </div>
    </footer>

    <!-- МОДАЛЬНОЕ ОКНО ВХОДА И РЕГИСТРАЦИИ (КАК НА САЙТЕ) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4">
        <div class="br-card p-6 rounded-2xl w-full max-w-md shadow-2xl relative border border-zinc-700">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl font-bold">&times;</button>
            
            <div class="text-center mb-6">
                <span class="bg-red-600 text-white font-black px-3 py-1 rounded text-sm tracking-wider">WAIT RUSSIA</span>
                <h2 id="modal-title" class="text-xl font-bold text-white mt-2">Авторизация</h2>
            </div>

            <div id="modal-error" class="bg-red-950/50 border border-red-800 text-red-300 text-xs p-3 rounded-lg mb-4 hidden"></div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1 font-semibold">Игровой ник (Nick_Name)</label>
                    <input type="text" id="auth-username" placeholder="Например: Majorka_Bounty" class="w-full br-input rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1 font-semibold">Пароль</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full br-input rounded-xl px-4 py-2.5 text-sm">
                </div>
                <button onclick="handleAuthSubmit()" id="modal-submit-btn" class="w-full br-red-btn text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-red-900/30">Войти</button>
            </div>

            <div class="mt-5 text-center text-xs text-zinc-400 border-t border-zinc-800 pt-4">
                <span id="switch-auth-text">Нет аккаунта на форуме?</span> 
                <span onclick="toggleAuthMode()" class="text-red-500 font-bold cursor-pointer hover:underline ml-1" id="switch-auth-btn">Регистрация</span>
            </div>
        </div>
    </div>

    <!-- СКРИПТ ЛОГИКИ ФОРУМА -->
    <script>
        // Инициализация базы данных
        if (!localStorage.getItem('wait_users')) {
            localStorage.setItem('wait_users', JSON.stringify([]));
        }
        if (!localStorage.getItem('wait_logged_in')) {
            localStorage.setItem('wait_logged_in', null);
        }
        if (!localStorage.getItem('wait_categories')) {
            const defaultCategories = [
                { id: 1, name: 'Важные новости и регламент', desc: 'Правила проекта, системные обновления и указы руководства.', icon: '📢', badge: 'Важно' },
                { id: 2, name: 'Сервер [15] BELGOROD', desc: 'Игровой процесс, жалобы и организация жизни на сервере Белгород.', icon: '🏙️', badge: 'Belgorod' },
                { id: 3, name: 'Технический раздел', desc: 'Проблемы с лаунчером, баги доната, баги привязки Telegram.', icon: '🛠️', badge: 'Support' },
                { id: 4, name: 'Жалобы на администрацию', desc: 'Обжалование наказаний, варнов и банов от модерации.', icon: '⚖️', badge: 'Жалобы' }
            ];
            localStorage.setItem('wait_categories', JSON.stringify(defaultCategories));
        }
        if (!localStorage.getItem('wait_threads')) {
            localStorage.setItem('wait_threads', JSON.stringify([
                { id: 1, catId: 1, title: 'Общие правила игровых серверов Wait Russia [Обязательно]', author: 'System_Admin', date: '18.09.2026', content: 'Добро пожаловать на проект! Запрещены любые виды читов, багоюз, оскорбления в OOC чат.', replies: [] },
                { id: 2, catId: 3, title: 'Не привязывается Telegram после обновы', author: 'Majorka_Bounty', date: '18.09.2026', content: 'Помогите, после утреннего патча бот в телеграме не принимает код подтверждения аккаунта!', replies: [
                    { author: 'Technical_Support', date: '18.09.2026 10:15', text: 'Перезапустите игру через официальный лаунчер, проблема была решена в горячем фиксе.' }
                ]}
            ]));
        }

        let isRegisterMode = false;

        // Обновление шапки пользователя
        function updateHeader() {
            const loggedUser = JSON.parse(localStorage.getItem('wait_logged_in'));
            const menu = document.getElementById('user-menu');
            
            if (loggedUser) {
                menu.innerHTML = `
                    <div class="flex items-center space-x-3 cursor-pointer br-card px-3 py-1.5 rounded-xl border border-zinc-800" onclick="openProfile('${loggedUser.username}')">
                        <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center font-bold text-white uppercase text-sm shadow">${loggedUser.username[0]}</div>
                        <div class="text-left hidden sm:block">
                            <div class="text-xs font-bold text-white leading-tight">${loggedUser.username}</div>
                            <div class="text-[10px] text-red-400">Игрок</div>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-2 rounded-xl text-zinc-300 transition font-semibold">Выйти</button>
                `;
            } else {
                menu.innerHTML = `
                    <button onclick="openAuthModal(false)" class="text-xs br-red-btn font-bold px-4 py-2 rounded-xl text-white transition shadow-md shadow-red-900/30">Войти</button>
                    <button onclick="openAuthModal(true)" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-zinc-300 transition font-semibold">Регистрация</button>
                `;
            }
        }

        // Главная страница
        function showHome() {
            document.getElementById('breadcrumbs').innerHTML = '<span class="text-white font-semibold">Главная страница форума</span>';
            document.getElementById('action-btn-container').innerHTML = '';
            
            const categories = JSON.parse(localStorage.getItem('wait_categories'));
            const container = document.getElementById('app-content');
            
            let html = '<div class="space-y-3">';
            categories.forEach(cat => {
                html += `
                    <div onclick="openCategory(${cat.id})" class="br-card p-4 rounded-xl hover:border-red-600/60 cursor-pointer transition flex items-center justify-between group shadow-sm">
                        <div class="flex items-center space-x-4">
                            <div class="text-3xl w-12 h-12 bg-zinc-900 rounded-xl flex items-center justify-center border border-zinc-800">${cat.icon}</div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h3 class="text-base font-bold text-zinc-100 group-hover:text-red-400 transition">${cat.name}</h3>
                                    <span class="text-[10px] bg-red-950/80 text-red-400 border border-red-900 px-2 py-0.5 rounded-md font-semibold">${cat.badge}</span>
                                </div>
                                <p class="text-xs text-zinc-400 mt-0.5">${cat.desc}</p>
                            </div>
                        </div>
                        <div class="text-zinc-600 group-hover:text-red-500 transition font-bold text-lg pr-2">›</div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // Открытие категории
        function openCategory(catId) {
            const categories = JSON.parse(localStorage.getItem('wait_categories'));
            const cat = categories.find(c => c.id === catId);
            const threads = JSON.parse(localStorage.getItem('wait_threads')).filter(t => t.catId === catId);
            const loggedUser = JSON.parse(localStorage.getItem('wait_logged_in'));

            document.getElementById('breadcrumbs').innerHTML = `
                <span class="cursor-pointer text-red-500 hover:underline" onclick="showHome()">Главная</span> 
                <span class="mx-2 text-zinc-600">/</span> 
                <span class="text-white font-semibold">${cat.name}</span>
            `;

            document.getElementById('action-btn-container').innerHTML = loggedUser ? 
                `<button onclick="openCreateThread(${catId})" class="br-red-btn text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-md shadow-red-900/30">+ Создать тему</button>` : 
                `<span class="text-xs text-zinc-500">Авторизуйтесь для создания тем</span>`;

            const container = document.getElementById('app-content');
            let html = '<div class="space-y-3">';
            
            if (threads.length === 0) {
                html += '<div class="br-card p-8 text-center text-zinc-500 rounded-xl text-xs">В этом разделе пока нет тем. Будьте первыми!</div>';
            } else {
                threads.forEach(t => {
                    html += `
                        <div onclick="openThread(${t.id})" class="br-card p-4 rounded-xl hover:border-zinc-600 cursor-pointer transition flex justify-between items-center shadow-sm">
                            <div>
                                <h4 class="font-bold text-zinc-100 hover:text-red-400 text-sm">${t.title}</h4>
                                <div class="text-[11px] text-zinc-400 mt-1">Автор: <span class="text-zinc-300 font-semibold">${t.author}</span> • Создано: ${t.date}</div>
                            </div>
                            <div class="text-xs bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg text-zinc-400 font-medium">${t.replies.length} отв.</div>
                        </div>
                    `;
                });
            }
            html += '</div>';
            container.innerHTML = html;
        }

        // Открытие темы
        function openThread(threadId) {
            const threads = JSON.parse(localStorage.getItem('wait_threads'));
            const thread = threads.find(t => t.id === threadId);
            const categories = JSON.parse(localStorage.getItem('wait_categories'));
            const cat = categories.find(c => c.id === thread.catId);
            const loggedUser = JSON.parse(localStorage.getItem('wait_logged_in'));

            document.getElementById('breadcrumbs').innerHTML = `
                <span class="cursor-pointer text-red-500 hover:underline" onclick="showHome()">Главная</span> <span class="mx-2 text-zinc-600">/</span> 
                <span class="cursor-pointer text-red-500 hover:underline" onclick="openCategory(${cat.id})">${cat.name}</span> <span class="mx-2 text-zinc-600">/</span>
                <span class="text-white font-semibold truncate max-w-xs inline-block align-bottom">${thread.title}</span>
            `;
            document.getElementById('action-btn-container').innerHTML = '';

            const container = document.getElementById('app-content');
            let html = `
                <div class="space-y-4">
                    <!-- Стартовое сообщение темы -->
                    <div class="br-card p-5 rounded-2xl shadow-md">
                        <h2 class="text-lg font-bold text-white mb-3">${thread.title}</h2>
                        <div class="flex items-center space-x-2 pb-3 mb-3 border-b border-zinc-800 text-xs text-zinc-400">
                            <span class="text-red-400 font-bold cursor-pointer" onclick="openProfile('${thread.author}')">${thread.author}</span>
                            <span>•</span>
                            <span>${thread.date}</span>
                        </div>
                        <p class="text-zinc-300 text-sm whitespace-pre-wrap leading-relaxed">${thread.content}</p>
                    </div>

                    <!-- Список ответов -->
                    <div class="space-y-3">
                        <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider pl-1">Ответы (${thread.replies.length})</h3>
            `;

            if (thread.replies.length === 0) {
                html += '<div class="text-xs text-zinc-500 br-card p-4 rounded-xl">Пока никто не оставил ответ.</div>';
            } else {
                thread.replies.forEach(r => {
                    html += `
                        <div class="br-card p-4 rounded-xl ml-0 md:ml-6 border-zinc-800/80">
                            <div class="flex justify-between items-center mb-2 text-xs">
                                <span class="font-bold text-red-400 cursor-pointer" onclick="openProfile('${r.author}')">${r.author}</span>
                                <span class="text-zinc-500 text-[10px]">${r.date}</span>
                            </div>
                            <p class="text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed">${r.text}</p>
                        </div>
                    `;
                });
            }

            html += `</div>`;

            // Форма отправки сообщения
            if (loggedUser) {
                html += `
                    <div class="br-card p-5 rounded-2xl mt-6 shadow-md space-y-3">
                        <h4 class="text-xs font-bold uppercase text-zinc-400">Оставить сообщение</h4>
                        <textarea id="reply-text" rows="3" placeholder="Введите ваш текст..." class="w-full br-input rounded-xl p-3 text-sm text-zinc-200"></textarea>
                        <button onclick="submitReply(${thread.id})" class="br-red-btn text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-md shadow-red-900/30">Отправить ответ</button>
                    </div>
                `;
            } else {
                html += `<div class="text-center text-xs text-zinc-500 py-4">Чтобы оставлять ответы, пожалуйста, <span onclick="openAuthModal(false)" class="text-red-500 cursor-pointer font-bold underline">войдите в аккаунт</span>.</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // Создание темы
        function openCreateThread(catId) {
            const categories = JSON.parse(localStorage.getItem('wait_categories'));
            const cat = categories.find(c => c.id === catId);

            document.getElementById('breadcrumbs').innerHTML = `
                <span class="cursor-pointer text-red-500 hover:underline" onclick="showHome()">Главная</span> <span class="mx-2 text-zinc-600">/</span> 
                <span class="cursor-pointer text-red-500 hover:underline" onclick="openCategory(${cat.id})">${cat.name}</span> <span class="mx-2 text-zinc-600">/</span>
                <span class="text-white font-semibold">Новая тема</span>
            `;
            document.getElementById('action-btn-container').innerHTML = '';

            document.getElementById('app-content').innerHTML = `
                <div class="br-card p-6 rounded-2xl max-w-2xl mx-auto space-y-4 shadow-xl">
                    <h2 class="text-lg font-bold text-white">Создание темы в разделе: <span class="text-red-500">${cat.name}</span></h2>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1 font-semibold">Заголовок темы</label>
                        <input type="text" id="new-thread-title" placeholder="Краткая суть проблемы или вопроса" class="w-full br-input rounded-xl p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1 font-semibold">Описание</label>
                        <textarea id="new-thread-content" rows="6" placeholder="Опишите подробности..." class="w-full br-input rounded-xl p-3 text-sm"></textarea>
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button onclick="saveNewThread(${catId})" class="br-red-btn text-white font-bold text-xs px-5 py-3 rounded-xl transition shadow-md shadow-red-900/30">Опубликовать</button>
                        <button onclick="openCategory(${catId})" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-4 py-3 rounded-xl transition font-semibold">Отмена</button>
                    </div>
                </div>
            `;
        }

        function saveNewThread(catId) {
            const title = document.getElementById('new-thread-title').value.trim();
            const content = document.getElementById('new-thread-content').value.trim();
            const loggedUser = JSON.parse(localStorage.getItem('wait_logged_in'));

            if (!title || !content) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            const threads = JSON.parse(localStorage.getItem('wait_threads'));
            const newThread = {
                id: Date.now(),
                catId: catId,
                title: title,
                author: loggedUser.username,
                date: new Date().toLocaleDateString(),
                content: content,
                replies: []
            };

            threads.unshift(newThread);
            localStorage.setItem('wait_threads', JSON.stringify(threads));
            openCategory(catId);
        }

        // Отправка ответа
        function submitReply(threadId) {
            const text = document.getElementById('reply-text').value.trim();
            const loggedUser = JSON.parse(localStorage.getItem('wait_logged_in'));

            if (!text) return;

            const threads = JSON.parse(localStorage.getItem('wait_threads'));
            const thread = threads.find(t => t.id === threadId);
            
            thread.replies.push({
                author: loggedUser.username,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                text: text
            });

            localStorage.setItem('wait_threads', JSON.stringify(threads));
            openThread(threadId);
        }

        // Профиль игрока
        function openProfile(username) {
            const users = JSON.parse(localStorage.getItem('wait_users'));
            let user = users.find(u => u.username === username);
            
            if (!user) {
                user = { username: username, role: 'Администратор сервера', joined: '01.01.2026' };
            }

            document.getElementById('breadcrumbs').innerHTML = `
                <span class="cursor-pointer text-red-500 hover:underline" onclick="showHome()">Главная</span> <span class="mx-2 text-zinc-600">/</span> 
                <span class="text-white font-semibold">Профиль: ${user.username}</span>
            `;
            document.getElementById('action-btn-container').innerHTML = '';

            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="br-card p-6 rounded-2xl max-w-md mx-auto flex items-center space-x-5 shadow-xl">
                    <div class="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center font-black text-2xl text-white uppercase shadow-lg shadow-red-900/40">${user.username[0]}</div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-bold text-white">${user.username}</h2>
                        <p class="text-xs text-red-400 font-bold uppercase tracking-wider">${user.role || 'Игрок проекта'}</p>
                        <p class="text-[11px] text-zinc-400">На форуме с: ${user.joined || '18.09.2026'}</p>
                    </div>
                </div>
            `;
        }

        // Модальное окно Вход/Регистрация
        function openAuthModal(register) {
            isRegisterMode = register;
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = register ? 'Регистрация аккаунта' : 'Авторизация';
            document.getElementById('modal-submit-btn').innerText = register ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('switch-auth-text').innerText = register ? 'Уже есть аккаунт?' : 'Нет аккаунта на форуме?';
            document.getElementById('switch-auth-btn').innerText = register ? 'Войти' : 'Регистрация';
            document.getElementById('modal-error').classList.add('hidden');
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function toggleAuthMode() {
            openAuthModal(!isRegisterMode);
        }

        function handleAuthSubmit() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorDiv = document.getElementById('modal-error');

            if (!username || !password) {
                errorDiv.innerText = 'Заполните все обязательные поля!';
                errorDiv.classList.remove('hidden');
                return;
            }

            let users = JSON.parse(localStorage.getItem('wait_users'));

            if (isRegisterMode) {
                const existing = users.find(u => u.username === username);
                if (existing) {
                    errorDiv.innerText = 'Этот игровой ник уже занят на форуме!';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                const newUser = { username, password, role: 'Игрок', joined: new Date().toLocaleDateString() };
                users.push(newUser);
                localStorage.setItem('wait_users', JSON.stringify(users));
                localStorage.setItem('wait_logged_in', JSON.stringify(newUser));
            } else {
                const user = users.find(u => u.username === username && u.password === password);
                if (!user) {
                    errorDiv.innerText = 'Неверный никнейм или пароль!';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                localStorage.setItem('wait_logged_in', JSON.stringify(user));
            }

            closeAuthModal();
            updateHeader();
            showHome();
        }

        function logout() {
            localStorage.setItem('wait_logged_in', null);
            updateHeader();
            showHome();
        }

        // Запуск при загрузке
        window.onload = function() {
            updateHeader();
            showHome();
        };
    </script>
</body>
</html>
